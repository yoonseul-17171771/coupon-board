<title>아자아자 🎟️</title>
<style>
  :root{
    --lilac:#B9A6F0;
    --lilac-2:#8E74DE;
    --lilac-3:#6C51C0;
    --lilac-soft:#F1EBFF;
    --cream:#FFFBF2;
    --peach:#FFD9C4;
    --mint:#CDEFE1;
    --butter:#FFEDBE;
    --ink:#3B3355;
    --ink-2:#6F6790;
    --ink-3:#9A93B0;
    --line:#EDE6FA;
    --white:#fff;
    --shadow:0 10px 26px rgba(111,83,196,.12);
    --r:24px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 560px at 8% -8%, #F2EBFF 0%, rgba(242,235,255,0) 62%),
      radial-gradient(900px 480px at 102% -2%, #FFF2DA 0%, rgba(255,242,218,0) 58%),
      linear-gradient(180deg,#FFFDF8 0%,#FBF6FF 100%);
    background-attachment:fixed;
    min-height:100vh;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;-webkit-user-select:none;user-select:none}
  input,select{font-family:inherit;color:var(--ink)}
  b{font-weight:800}

  /* ---------- top bar ---------- */
  .topbar{
    max-width:1080px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px 6px;
    display:flex;align-items:center;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .logo{font-size:30px;line-height:1;filter:drop-shadow(0 4px 8px rgba(142,116,222,.3))}
  .brand h1{font-size:19px;margin:0;letter-spacing:-.02em}
  .brand p{margin:1px 0 0;font-size:12.5px;color:var(--ink-3);font-weight:600}
  .icon-btn{
    width:44px;height:44px;border-radius:16px;background:#fff;border:2px solid var(--line);
    display:grid;place-items:center;font-size:19px;box-shadow:0 4px 12px rgba(111,83,196,.08);
    transition:transform .15s ease;
  }
  .icon-btn:active{transform:scale(.94)}
  .icon-btn.off{opacity:.55}

  /* ---------- kid tabs ---------- */
  .tabs{
    position:sticky;top:0;z-index:20;
    max-width:1080px;margin:0 auto;padding:8px 18px 10px;
    display:flex;gap:10px;
    background:linear-gradient(180deg,rgba(255,253,248,.97) 0%,rgba(255,253,248,.9) 72%,rgba(255,253,248,0) 100%);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .tab{
    flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    padding:12px 8px;border-radius:18px;border:2px solid var(--line);background:#fff;
    font-size:16px;font-weight:800;color:var(--ink-2);
    transition:transform .16s ease,box-shadow .16s ease;
    min-height:52px;
  }
  .tab:active{transform:scale(.97)}
  .tab .tab-emoji{font-size:20px;line-height:1}
  .tab .tab-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:400px){
    .tab{font-size:15px;padding:12px 6px;gap:6px}
  }
  .tab.active{
    background:linear-gradient(135deg,var(--lilac) 0%,var(--lilac-2) 100%);
    border-color:transparent;color:#fff;
    box-shadow:0 10px 22px rgba(142,116,222,.34);
  }
  .tab .mini{font-size:11.5px;font-weight:800;padding:2px 6px;border-radius:999px;background:var(--lilac-soft);color:var(--lilac-3)}
  .tab.active .mini{background:rgba(255,255,255,.24);color:#fff}

  /* ---------- layout ---------- */
  .layout{max-width:1080px;margin:0 auto;padding:0 18px;display:grid;gap:16px;grid-template-columns:1fr;align-items:start}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  .col:empty{display:none}
  @media (min-width:820px){
    .layout{grid-template-columns:1fr 1fr;align-items:stretch}
    /* 좌우 두 열을 같은 높이로 늘리고, 각 열의 마지막 카드가 남는 여백을 흡수해
       두 열의 맨 아래 라인이 정확히 나란히 서게 합니다. */
    .col>.card:last-child{flex:1 0 auto}
    /* 남는 높이는 마지막 카드가 흡수하고, 미션 카드는 안쪽 판(mission-box)이 그 높이를 채워
       내용이 위에 몰리거나 빈 공간이 붙지 않게 합니다. */
    .col>.card:last-child#missionCard{display:flex;flex-direction:column}
    .col>.card:last-child#missionCard>.mission-box{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center}
    /* 카드 높이를 잴 때는 늘어나기 전의 자연 높이를 씁니다 */
    html.measuring-cards #layout>.col>.card:last-child{flex-grow:0;display:block}
    html.measuring-cards #layout>.col>.card:last-child>.mission-box{flex-grow:0;display:block}
  }
  .card{
    background:#fff;border-radius:var(--r);padding:18px;
    border:2px solid #F2ECFF;box-shadow:var(--shadow);
  }
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .card-head h2{font-size:16.5px;margin:0;letter-spacing:-.02em;flex:1}
  .card-head .badge{
    font-size:12px;font-weight:800;color:var(--lilac-3);background:var(--lilac-soft);
    padding:4px 9px;border-radius:999px;
  }
  .muted{color:var(--ink-3);font-size:13px;font-weight:600}

  /* ---------- streak ---------- */
  .streak-hero{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .flame{
    width:62px;height:62px;flex:0 0 62px;border-radius:22px;
    display:grid;place-items:center;font-size:32px;
    background:linear-gradient(140deg,#FFF0D8,#FFE0C7);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 8px 18px rgba(255,166,110,.28);
    animation:breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.04)}}
  .streak-num{font-size:14px;font-weight:700;color:var(--ink-2)}
  .streak-num b{font-size:30px;color:var(--ink);line-height:1;margin-right:3px;letter-spacing:-.03em}
  .streak-sub{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:3px}

  .stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:4px 0 12px}
  .stamp-cell{
    aspect-ratio:1/1;border-radius:14px;border:2px dashed #E4DAF9;background:#FCFAFF;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    font-size:11px;font-weight:800;color:#C6BEDC;position:relative;
  }
  .stamp-cell.milestone{border-style:solid;border-color:#EADFF8;background:#FFFDF6}
  .stamp-cell.milestone .m-emoji{font-size:15px;filter:grayscale(1);opacity:.42}
  .stamp-cell.filled{
    border:2px solid transparent;
    background:linear-gradient(140deg,#CBB8F8,#9C82E6);
    color:#fff;box-shadow:0 6px 14px rgba(142,116,222,.3);
    transform:rotate(-2deg);
  }
  .stamp-cell.filled .m-emoji{filter:none;opacity:1}
  .stamp-cell.filled::after{content:"✔";position:absolute;font-size:12px;bottom:2px;right:4px;opacity:.85}

  .gauge{height:12px;border-radius:999px;background:#F3EEFF;overflow:hidden;margin-bottom:10px}
  .gauge i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#C7B5F7,#8E74DE);transition:width .5s cubic-bezier(.2,.8,.3,1)}
  .next-hint{
    display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink-2);
    background:#FBF8FF;border:2px solid #F1EBFF;border-radius:16px;padding:10px 12px;
  }
  .next-hint .gift{font-size:18px}
  .next-hint b{color:var(--lilac-3)}

  /* ---------- 새 쿠폰 회차 / 20일 완주 ---------- */
  .round-done{
    margin-top:2px;padding:12px 12px 11px;border-radius:16px;text-align:center;
    background:linear-gradient(135deg,#FFF6E5,#F3ECFF);border:2px dashed rgba(142,116,222,.42);
  }
  .round-done .rd-title{font-size:13.5px;font-weight:900;color:var(--lilac-3);letter-spacing:-.01em;line-height:1.45;word-break:keep-all}
  .round-done .rd-sub{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-top:3px;line-height:1.5;word-break:keep-all}
  .round-done .rd-actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:9px}
  .rd-confirm{font-size:11.5px;font-weight:800;color:var(--ink-2);line-height:1.55;word-break:keep-all}
  .round-done .rd-confirm{margin-top:2px}

  /* ---------- 누적 책 권수 목표 ---------- */
  .bgoal{
    margin:0 0 12px;padding:11px 12px 10px;border-radius:16px;
    background:#FBF8FF;border:2px solid #F1EBFF;
  }
  .bgoal-row{display:flex;align-items:baseline;gap:5px;font-size:12px;font-weight:800;color:var(--ink-3)}
  .bgoal-row .now{font-size:15.5px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .bgoal-row .goal{color:var(--lilac-3);font-weight:900;font-variant-numeric:tabular-nums}
  .bgoal-row .pct{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .bgoal-bar{height:9px;border-radius:999px;background:#F0EAFB;overflow:hidden;margin-top:6px}
  .bgoal-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#C7B5F7,#8E74DE);transition:width .5s cubic-bezier(.2,.8,.3,1)}
  .bgoal-bar.done i{background:linear-gradient(90deg,#FFD28A,#FFAE5C)}
  .bgoal-banner{
    display:flex;align-items:center;gap:6px;margin-top:8px;padding:8px 10px;border-radius:12px;
    font-size:12.5px;font-weight:900;letter-spacing:-.01em;line-height:1.4;word-break:keep-all;
    background:linear-gradient(135deg,#FFF1CF,#FFE8DC);border:1.5px solid #FFE0B0;color:#A2681A;
  }
  .bgoal-banner.t2{background:linear-gradient(135deg,#F3E8FF,#E9F1FF);border-color:#DCCBFF;color:#6C51C0}

  /* ---------- tasks ---------- */
  .task-list{display:flex;flex-direction:column;gap:9px}
  .task{
    position:relative;display:flex;align-items:center;gap:11px;
    padding:9px 10px 9px 9px;border-radius:18px;background:#FCFAFF;border:2px solid #F2ECFF;
    transition:background .18s ease,border-color .18s ease,transform .1s ease;
  }
  .task:active{transform:scale(.99)}
  .task .t-emoji{
    width:40px;height:40px;flex:0 0 40px;border-radius:14px;background:#fff;
    display:grid;place-items:center;font-size:20px;
    box-shadow:0 3px 9px rgba(111,83,196,.10);
  }
  .task .t-label{flex:1;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
  .task.done{background:#F4EEFF;border-color:#DFD3FF}
  .task.done .t-label{color:#8B80A6;text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#C8BAEB}
  .check{
    width:46px;height:46px;flex:0 0 46px;border-radius:50%;
    border:3px solid #DED2FF;background:#fff;color:transparent;
    display:grid;place-items:center;font-size:20px;font-weight:900;
    transition:transform .12s ease,background .18s ease;
  }
  .check:active{transform:scale(.9)}
  .task.done .check{background:linear-gradient(135deg,var(--lilac),var(--lilac-2));border-color:transparent;color:#fff}
  .stamp{
    position:absolute;right:64px;top:50%;transform:translateY(-50%) rotate(-9deg);
    font-size:13px;font-weight:900;color:#E4708A;border:3px solid #E4708A;border-radius:11px;
    padding:1px 8px;background:rgba(255,255,255,.75);pointer-events:none;
    letter-spacing:.02em;
  }
  .stamp.soft{animation:stampSoft .3s ease-out both}
  @keyframes stampSoft{
    0%{transform:translateY(-50%) rotate(-9deg) scale(.96);opacity:0}
    100%{transform:translateY(-50%) rotate(-9deg) scale(1);opacity:1}
  }
  .task-foot{margin-top:11px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-3)}
  .task-foot .dots{display:flex;gap:4px}
  .task-foot .dot{width:9px;height:9px;border-radius:99px;background:#E7DEFA}
  .task-foot .dot.on{background:linear-gradient(135deg,#B9A6F0,#8E74DE)}
  .task-foot .dot.goal{box-shadow:0 0 0 2px #F3EDFF}
  /* ---------- 기록 입력: 권수(권) ---------- */
  .io-list{display:flex;flex-direction:column;gap:11px}
  .io-item{
    border-radius:20px;padding:12px 12px 11px;
    background:linear-gradient(140deg,#FCFAFF,#F7F2FF);
    border:2px solid #F0E9FC;
  }
  .io-top{display:flex;align-items:center;gap:9px}
  .io-emoji{
    width:34px;height:34px;flex:0 0 34px;border-radius:12px;background:#fff;
    display:grid;place-items:center;font-size:17px;
    box-shadow:0 3px 9px rgba(111,83,196,.10);
  }
  .io-name{flex:1;min-width:0;font-size:14.5px;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .io-today{display:flex;align-items:baseline;gap:2px;font-size:11.5px;font-weight:800;color:var(--ink-3);flex:0 0 auto}
  .io-today b{
    font-size:22px;line-height:1;color:var(--lilac-3);font-variant-numeric:tabular-nums;
    letter-spacing:-.03em;display:inline-block;
  }
  .io-today.bump b{animation:ioBump .36s ease-out both}
  @keyframes ioBump{0%{transform:scale(1)}42%{transform:scale(1.16)}100%{transform:scale(1)}}
  .io-sub{margin:5px 0 8px 43px;font-size:11.5px;font-weight:700;color:var(--ink-3);line-height:1.5}
  .io-sub b{color:var(--ink-2);font-weight:800}
  .io-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .io-quick.three{grid-template-columns:repeat(3,1fr)}
  .io-q{
    min-height:44px;padding:8px 2px;border-radius:13px;font-size:13px;font-weight:800;
    background:#fff;border:2px solid #EDE5FB;color:var(--lilac-3);
    box-shadow:0 3px 8px rgba(111,83,196,.07);transition:transform .12s ease;
  }
  .io-q:active{transform:scale(.95)}
  .io-q.plus{
    background:linear-gradient(135deg,var(--lilac),var(--lilac-2));color:#fff;border-color:transparent;
    box-shadow:0 5px 13px rgba(142,116,222,.26);
  }
  .io-q.minus{color:#A79FBC;background:#FBF9FF}
  .io-set{display:flex;align-items:center;gap:6px;margin-top:8px}
  .io-set input{
    flex:1 1 auto;min-width:0;max-width:112px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);
    background:#fff;font-size:14px;font-weight:800;text-align:center;outline:none;
    -moz-appearance:textfield;
  }
  .io-set input::-webkit-outer-spin-button,.io-set input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .io-set input:focus{border-color:var(--lilac)}
  .io-set .u{font-size:12px;font-weight:800;color:var(--ink-3);flex:0 0 auto}
  .io-del{flex:0 0 auto;margin-left:auto;font-size:11px;font-weight:800;color:#B3ABC6;text-decoration:underline;white-space:nowrap;padding:4px 2px}
  .io-hist{margin-top:12px;border-top:2px solid #F4EEFF;padding-top:10px}
  .io-hist-head{font-size:11.5px;font-weight:800;color:var(--ink-3);margin:0 0 6px;display:flex;align-items:center;gap:5px}
  .io-hist-head span{margin-left:auto;font-weight:700;color:#BDB6CE}
  .io-table{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
  .io-table th{font-weight:800;color:var(--ink-3);padding:3px 1px 4px;text-align:center;white-space:nowrap;font-size:11px}
  .io-table th:first-child{text-align:left;padding-left:2px}
  .io-table td{
    padding:5px 1px;text-align:center;font-weight:700;color:var(--ink-2);
    border-top:1.5px solid #F6F2FF;white-space:nowrap;
  }
  .io-table td:first-child{text-align:left;color:var(--ink-3);font-weight:800;padding-left:2px}
  .io-table tr.is-today td{color:var(--lilac-3);font-weight:900}
  .io-table td.total{color:var(--ink);font-weight:900}
  .io-table .zero{color:#D8D2E7;font-weight:700}
  .io-foot{margin:9px 0 0;font-size:11.5px;font-weight:600;color:var(--ink-3);line-height:1.6;word-break:keep-all}

  /* ---------- coupons ---------- */
  .coupon-list{display:flex;flex-direction:column;gap:11px}
  .coupon{
    position:relative;display:flex;align-items:center;gap:12px;
    padding:13px 13px;border-radius:18px;
    background:linear-gradient(135deg,#FFFDFB 0%,#F8F2FF 100%);
    border:2px dashed rgba(142,116,222,.45);
  }
  .coupon.free{background:linear-gradient(135deg,#FFFDF7,#FFF0DC);border-color:rgba(240,175,90,.5)}
  .coupon.store{background:linear-gradient(135deg,#FBFEFF,#E8F7F1);border-color:rgba(90,190,160,.45)}
  .coupon.artbox{background:linear-gradient(135deg,#FFFCFF,#FFEAF4);border-color:rgba(230,120,170,.45)}
  .coupon.gonggi{background:linear-gradient(135deg,#FBFAFF,#EAF1FF);border-color:rgba(122,152,226,.45)}
  .coupon.lotte{background:linear-gradient(135deg,#FBF7FF,#EBDFFF);border-color:rgba(142,116,222,.55);box-shadow:0 8px 20px rgba(142,116,222,.14)}
  .coupon.lotte .c-emoji{box-shadow:0 4px 12px rgba(142,116,222,.22)}
  .coupon.used{background:linear-gradient(135deg,#FBF8F3,#F4F0EA);border-color:#E2DBD1;opacity:.92;padding-bottom:24px}
  .c-emoji{
    width:46px;height:46px;flex:0 0 46px;border-radius:16px;background:#fff;
    display:grid;place-items:center;font-size:23px;
    box-shadow:0 4px 11px rgba(111,83,196,.12);
  }
  .c-body{flex:1;min-width:0}
  .c-title{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .c-tag{
    display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;
    font-size:10.5px;font-weight:900;letter-spacing:.02em;vertical-align:2px;
    background:#F3EDFF;color:#7A63C9;border:1px solid #E6DCFF;
  }
  .c-tag.gonggi{background:#EEF4FF;color:#5C7BC8;border-color:#DCE7FF}
  .c-tag.store{background:#E8F7F1;color:#3E9A83;border-color:#D3EFE5}
  .c-tag.artbox{background:#FFEAF4;color:#C85F92;border-color:#FFD8E8}
  .c-tag.lotte{background:#EDE2FF;color:#6C51C0;border-color:#DCCBFF}
  .coupon.used .c-title{text-decoration:line-through;color:#A69EB4}
  .c-meta{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:2px}
  .use-btn{
    flex:0 0 auto;padding:10px 14px;border-radius:14px;font-size:13.5px;font-weight:800;
    background:linear-gradient(135deg,var(--lilac),var(--lilac-2));color:#fff;
    box-shadow:0 6px 14px rgba(142,116,222,.3);min-height:42px;
  }
  .use-btn:active{transform:scale(.95)}
  .use-btn.ghost{background:#fff;color:var(--ink-2);border:2px solid var(--line);box-shadow:none}
  .used-stamp{
    position:absolute;right:12px;top:6px;transform:rotate(-12deg);
    border:2px solid #E27C7C;color:#E27C7C;border-radius:8px;padding:1px 7px;
    font-size:11px;font-weight:900;letter-spacing:.08em;background:rgba(255,255,255,.6);
  }
  .undo{
    position:absolute;right:11px;bottom:4px;font-size:11px;font-weight:800;color:var(--ink-3);
    text-decoration:underline;padding:2px 4px;
  }
  .pop > *:not(.confetti){position:relative;z-index:2}
  .empty{
    text-align:center;padding:20px 10px;border-radius:18px;border:2px dashed #EFE8FB;background:#FDFBFF;
    color:var(--ink-3);font-size:13.5px;font-weight:700;line-height:1.6;
  }
  .empty .big{font-size:26px;display:block;margin-bottom:6px;opacity:.75}

  /* ---------- mission ---------- */
  .mission-box{
    border-radius:20px;padding:18px 16px;text-align:center;
    background:linear-gradient(140deg,#FFF7E6 0%,#FBEFFF 55%,#EFF7FF 100%);
    border:2px solid #F6EBFF;
  }
  .mission-text{font-size:16px;font-weight:800;line-height:1.5;letter-spacing:-.01em;min-height:26px}
  .mission-text.done{color:#8B80A6}
  .mission-sub{font-size:12px;font-weight:700;color:var(--ink-3);margin-top:7px;line-height:1.55}
  .mission-sub b{color:var(--lilac-3);font-weight:900}
  .mission-box.locked{background:#FCFAFF;border-style:dashed;border-color:#E9E1F8}
  .mission-actions{display:flex;gap:9px;margin-top:13px;justify-content:center;flex-wrap:wrap}
  .btn{
    padding:12px 18px;border-radius:16px;font-size:14.5px;font-weight:800;min-height:46px;
    background:#fff;border:2px solid var(--line);color:var(--ink-2);
    box-shadow:0 4px 12px rgba(111,83,196,.08);transition:transform .12s ease;
  }
  .btn:active{transform:scale(.96)}
  .btn.primary{background:linear-gradient(135deg,var(--lilac),var(--lilac-2));color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(142,116,222,.32)}
  .btn.warm{background:linear-gradient(135deg,#FFC98B,#FF9E7A);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(255,150,110,.32)}
  .btn.tiny{padding:8px 12px;font-size:12.5px;min-height:38px;border-radius:12px}
  .add-row{display:flex;gap:8px;margin-top:11px}
  .add-row input{
    flex:1;min-width:0;padding:11px 13px;border-radius:14px;border:2px solid var(--line);
    background:#FCFAFF;font-size:14px;font-weight:600;outline:none;
  }
  .add-row input:focus{border-color:var(--lilac);background:#fff}

  /* ---------- view switch ---------- */
  .viewtabs{
    max-width:1080px;margin:0 auto;padding:0 18px 12px;display:flex;gap:9px;
  }
  .vtab{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 10px;border-radius:15px;border:2px solid var(--line);background:#fff;
    font-size:13.5px;font-weight:800;color:var(--ink-2);min-height:46px;
    transition:transform .14s ease,background .18s ease,color .18s ease;
  }
  .vtab:active{transform:scale(.97)}
  .vtab.active{background:var(--lilac-soft);border-color:#DDD0FB;color:var(--lilac-3)}

  /* ---------- quiz ---------- */
  .quiz-wrap{max-width:1080px;margin:0 auto;padding:0 18px}
  .quiz-card{padding:16px 16px 18px}
  .quiz-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
  .quiz-meta .book{
    font-size:11.5px;font-weight:800;color:#4E7BA8;background:#EEF7FF;
    border:1.5px solid #DCEBF9;padding:3px 8px;border-radius:999px;
  }

  const DAY_MS = 86400000;

  const NY_DAY = '2027-01-01';

  const $ = (sel, root) => (root || document).querySelector(sel);
  const el = {
    tabs: $('#tabs'), todayLabel: $('#todayLabel'), soundBtn: $('#soundBtn'),
    streakCard: $('#streakCard'), taskCard: $('#taskCard'), couponCard: $('#couponCard'),
    missionCard: $('#missionCard'), settingsWrap: $('#settingsWrap'),

  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function dateStr(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function todayStr(){ return dateStr(new Date()); }
  function yesterdayStr(){ return dateStr(new Date(Date.now() - DAY_MS)); }

  /* 두 날짜(YYYY-MM-DD) 사이의 일수 — 오늘 기준 남은 날 */
  function daysUntil(iso){
    const now = new Date();
    const parts = String(iso).split('-').map(Number);
    if (parts.length !== 3 || parts.some(function(n){ return !isFinite(n); })) return 0;
    const from = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    const to = Date.UTC(parts[0], parts[1] - 1, parts[2]);
    return Math.round((to - from) / DAY_MS);
  }

  function koreanDate(d){
    const days = ['일','월','화','수','목','금','토'];
    return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + days[d.getDay()] + '요일';
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function shortDate(iso){
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return (d.getMonth()+1) + '/' + d.getDate();
  }

  let toastTimer = null;
  function toast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.toast.classList.remove('show'); }, 2200);
  }

  /* ===================== 저장 ===================== */
  let storageOK = true;

  function defaultKid(day){
    return { streak:0, best:0, totalDone:0, lastDone:null, date:day, tasks:{}, coupons:[], books:{}, drawDate:day, drawsLeft:0,
             round:0, goalDone:{} };
  }

  /* 쿠폰 보상 기본 문구 — 부모 설정에서 바꾸면 state.settings.rewards 에 저장됩니다. */
  function baseRewards(){
    const r = {};
    MILESTONES.forEach(function(m){ r[m.type] = m.title; });
    return r;
  }

  function defaultState(){
    const t = todayStr();
    const kids = {};
    KIDS.forEach(function(k){ kids[k.id] = defaultKid(t); });
    return {
      v: 4,
      active: 'kid1',
      kids: kids,
      missions: BASE_MISSIONS.map(function(text, i){ return { id:'base' + i, text:text, custom:false }; }),
      mission: { date:null, text:'', done:false },
      settings: { sound:true, rewards:baseRewards(), goal1:GOAL_DEFAULT_1, goal2:GOAL_DEFAULT_2 }
    };
  }

  let needsMigrateSave = false;

  function loadState(){
    const base = defaultState();
    let saved = null;
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) saved = JSON.parse(raw);
    } catch (e) { storageOK = false; }

    if (!saved || typeof saved !== 'object') return base;

    const s = Object.assign(base, saved);
    delete s.preset;   /* 예전 판에서 저장된, 이제 쓰지 않는 값 정리 */
    s.settings = Object.assign({ sound:true, rewards:baseRewards(), goal1:GOAL_DEFAULT_1, goal2:GOAL_DEFAULT_2 }, saved.settings || {});
    const defRewards = baseRewards();
    const rewards = {};
    MILESTONES.forEach(function(m){
      const v = s.settings.rewards && s.settings.rewards[m.type];
      rewards[m.type] = (typeof v === 'string' && v.trim()) ? v.trim().slice(0, 24) : defRewards[m.type];
    });
    s.settings.rewards = rewards;
    s.settings.goal1 = safeGoal(s.settings.goal1, GOAL_DEFAULT_1);
    s.settings.goal2 = safeGoal(s.settings.goal2, GOAL_DEFAULT_2);
    if (s.settings.goal2 <= s.settings.goal1) {
      if (s.settings.goal1 >= 9999) s.settings.goal1 = 9998;
      s.settings.goal2 = Math.min(9999, s.settings.goal1 + 1);
    }
    s.mission  = Object.assign({ date:null, text:'', done:false }, saved.mission || {});
    s.kids     = s.kids && typeof s.kids === 'object' ? s.kids : {};
    s.missions = Array.isArray(saved.missions) && saved.missions.length ? saved.missions : base.missions;

    KIDS.forEach(function(k){
      const from = s.kids[k.id] || {};
      const kid = Object.assign(defaultKid(base.kids[k.id].date), from);
      kid.tasks   = (from.tasks && typeof from.tasks === 'object') ? from.tasks : {};
      kid.coupons = Array.isArray(from.coupons) ? from.coupons : [];
      kid.streak  = Number(kid.streak) || 0;
      kid.best    = Number(kid.best) || 0;
      kid.totalDone = Number(kid.totalDone) || 0;
      kid.round   = Math.max(0, Math.round(Number(kid.round) || 0));
      kid.goalDone = (kid.goalDone && typeof kid.goalDone === 'object' && !Array.isArray(kid.goalDone)) ? kid.goalDone : {};
      s.kids[k.id] = kid;
    });

    /* --- 마이그레이션(이전 저장본 → v4) ---
       · 할 일은 v1의 7개(focus/listen/engbook/kobook/math/engwb/ppajak)와
         v2의 2개(engbook/kobook) 이름을 모두 새 8개 id로 옮겨 받습니다.
       · 권수 기록은 kid.books 에 날짜별(YYYY-MM-DD)로 쌓입니다.
       · 예전 학습 시간(kid.time)은 화면에서 쓰지 않지만, 저장본은 손대지 않고 둡니다. */
    KIDS.forEach(function(k){
      const kid = s.kids[k.id];

      const rawTasks = (kid.tasks && typeof kid.tasks === 'object') ? kid.tasks : {};
      const nextTasks = {};
      Object.keys(TASK_ALIASES).forEach(function(newId){
        (TASK_ALIASES[newId] || []).forEach(function(oldId){
          if (rawTasks[oldId] === true || rawTasks[oldId] === 'true') nextTasks[newId] = true;
        });
      });
      kid.tasks = nextTasks;

      const bookSrc = (kid.books && typeof kid.books === 'object' && !Array.isArray(kid.books)) ? kid.books : {};
      const cleanBooks = {};
      Object.keys(bookSrc).forEach(function(d){
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
        const one = bookSrc[d];
        if (!one || typeof one !== 'object' || Array.isArray(one)) return;
        const rec = {};
        BOOK_ITEMS.forEach(function(it){
          const v = clampInt(one[it.id], BOOK_MAX);
          if (v > 0) rec[it.id] = v;
        });
        if (Object.keys(rec).length) cleanBooks[d] = rec;
      });
      kid.books = cleanBooks;
    });
    s.v = 4;
    if (Number(saved.v) !== 4) needsMigrateSave = true;

    if (!s.kids[s.active]) s.active = 'kid1';
    return s;
  }

  let state = loadState();

  /* 예전 저장본을 새 구성으로 바꿨다면 그 모습으로 다시 저장해 둡니다. */
  if (needsMigrateSave) { needsMigrateSave = false; save(); }

  function save(){
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (e) {
      if (storageOK) { storageOK = false; toast('이 브라우저에 저장이 안 돼요. 탭을 닫으면 사라져요!'); }
    }
  }

  /* ===================== 날짜 넘어감 / 스트릭 정리 ===================== */
  function normalizeDay(){
    const t = todayStr();
    let changed = false;

    KIDS.forEach(function(k){
      const kid = state.kids[k.id];
      if (kid.date !== t) {
        kid.date = t;
        kid.tasks = {};
        changed = true;
      }
      if (kid.streak > 0 && kid.lastDone && kid.lastDone !== t && kid.lastDone !== yesterdayStr()) {
        kid.streak = 0;
        changed = true;
      }
      /* 미션 뽑기권은 하루 단위 — 날이 바뀌면 0부터 다시 쌓입니다. */
      if (kid.drawDate !== t) {
        kid.drawDate = t;
        kid.drawsLeft = 0;
        changed = true;
      }
    });

    if (state.mission.date && state.mission.date !== t) {
      state.mission = { date:null, text:'', done:false };
      changed = true;
    }

    if (changed) { save(); renderAll(); }
    return changed;
  }

  /* ===================== 계산 ===================== */
  function curKid(){ return KIDS.filter(function(k){ return k.id === state.active; })[0] || KIDS[0]; }
  function kidState(id){ return state.kids[id || state.active]; }
  function doneCount(kid){ return TASKS.filter(function(t){ return !!kid.tasks[t.id]; }).length; }
  /* 8개 중 6개(SUCCESS_NEED) 이상이면 그날 성공 — 순서는 상관없어요 */
  function isSuccess(kid){ return doneCount(kid) >= SUCCESS_NEED; }
  function successLeft(kid){ return Math.max(0, SUCCESS_NEED - doneCount(kid)); }
  /* 오늘 성공 도장을 이미 받았는지 */
  function stampedToday(kid){ return kid.lastDone === todayStr(); }
  /* 오늘 남은 미션 뽑기 횟수 (도장 받을 때마다 1번씩 열림) */
  function drawsLeft(kid){
    return (kid.drawDate === todayStr()) ? Math.max(0, Math.round(Number(kid.drawsLeft) || 0)) : 0;
  }
  function grantDraw(kid){
    const left = drawsLeft(kid);
    kid.drawDate = todayStr();
    kid.drawsLeft = left + 1;
  }
  function cycleDayOf(streak){ return streak > 0 ? ((streak - 1) % CYCLE_DAYS) + 1 : 0; }

  /* 쿠폰 회차 — 20일을 채워 '새 회차 시작'을 누르면 kid.round 가 1 늘어나
     도장판은 0일부터, 이번 회차 쿠폰 발급 표시는 새로 시작됩니다.
     (20일을 넘겨 그대로 이어 가도 회차가 자동으로 넘어가요.) */
  function roundOf(kid){
    const base = Math.max(0, Math.round(Number(kid && kid.round) || 0));
    const st = Number(kid && kid.streak) || 0;
    const auto = st > CYCLE_DAYS ? Math.floor((st - 1) / CYCLE_DAYS) : 0;
    return base + auto;
  }
  function cycleOf(kid){ return roundOf(kid) + 1; }

  /* 쿠폰 보상 문구 — 부모 설정 값이 있으면 그 문구, 없으면 기본 문구 */
  function rewardTitle(type, fallback){
    const r = state.settings.rewards || {};
    const v = r[type];
    return (typeof v === 'string' && v.trim()) ? v.trim() : fallback;
  }

  function nextMilestone(streak){
    const day = cycleDayOf(streak);
    for (let i = 0; i < MILESTONES.length; i++) {
      if (MILESTONES[i].day > day) return { m: MILESTONES[i], need: MILESTONES[i].day - day };
    }
    return { m: MILESTONES[0], need: (CYCLE_DAYS - day) + MILESTONES[0].day };
  }

  function awardCoupons(kid, streak){
    const issued = [];
    const cycle = roundOf(kid);
    const day = cycleDayOf(streak);

    MILESTONES.forEach(function(m){
      if (m.day !== day) return;
      const key = 'c' + cycle + '-d' + m.day;
      if (kid.coupons.some(function(c){ return c.key === key; })) return;
      kid.coupons.unshift({
        id: uid(), key: key, emoji: m.emoji, title: rewardTitle(m.type, m.title), desc: m.desc, type: m.type,
        issuedAt: new Date().toISOString(), used: false, usedAt: null, streakAt: streak
      });
      issued.push(m);
    });
    return issued;
  }

  /* ===================== 소리 ===================== */
  let audioCtx = null;

  function ensureAudio(){
    if (!state.settings.sound) return false;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return false;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
      return true;
    } catch (e) { return false; }
  }

  function tone(freq, start, dur, vol){
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + start;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function playChime(){
    if (!ensureAudio()) return;
    [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){ tone(f, i * 0.16, 0.5, 0.16); });
  }

  function playTick(){
    if (!ensureAudio()) return;
    tone(880, 0, 0.14, 0.07);
  }

  function playStamp(){
    if (!ensureAudio()) return;
    tone(392, 0, 0.16, 0.13);
    tone(587.33, 0.06, 0.18, 0.1);
  }

  function buzz(pattern){
    if (!state.settings.sound) return;
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  }

  /* ===================== 렌더: 탭 ===================== */
  function renderTabs(){
    el.tabs.innerHTML = KIDS.map(function(k){
      const kid = state.kids[k.id];
      const active = state.active === k.id;
      const badges = [];
      if (kid.streak > 0) badges.push('<span class="mini">🔥' + kid.streak + '</span>');
      if (stampedToday(kid)) badges.push('<span class="mini">✅</span>');
      return '<button class="tab' + (active ? ' active' : '') + '" data-action="tab" data-kid="' + k.id + '" aria-pressed="' + active + '">' +
        '<span class="tab-emoji">' + k.emoji + '</span><span class="tab-name">' + k.name + '</span>' + badges.join('') +
      '</button>';
    }).join('');
  }

  /* ===================== 렌더: 스트릭 ===================== */
  function renderStreak(){
    const k = curKid();
    const kid = kidState(k.id);
    const streak = kid.streak;
    const day = cycleDayOf(streak);
    const cycle = cycleOf(kid);
    const nm = nextMilestone(streak);
    const complete = day >= CYCLE_DAYS;

    let cells = '';
    for (let d = 1; d <= CYCLE_DAYS; d++) {
      const ms = MILESTONES.filter(function(m){ return m.day === d; })[0];
      const filled = d <= day;
      const cls = 'stamp-cell' + (filled ? ' filled' : '') + (ms ? ' milestone' : '');
      const inner = ms
        ? '<span class="m-emoji">' + ms.emoji + '</span><span>' + d + '</span>'
        : '<span>' + d + '</span>';
      cells += '<div class="' + cls + '" title="' + (ms ? ms.title : d + '일째') + '">' + inner + '</div>';
    }

    const pct = Math.round((day / CYCLE_DAYS) * 100);
    const streakLine = streak > 0
      ? '<div class="streak-num"><b>' + streak + '</b>일 연속 성공</div>'
      : '<div class="streak-num"><b>0</b>일 · 오늘부터 시작!</div>';

    const subLine = (kid.best > 0 || kid.totalDone > 0)
      ? '최고 기록 ' + kid.best + '일 · 지금까지 ' + kid.totalDone + '일 성공'
      : '할 일 ' + TASKS.length + '개 중 ' + SUCCESS_NEED + '개 이상 하면 1일째 시작이에요';

    const cycleNote = cycle > 1 ? '<span class="badge">' + cycle + '번째 사이클</span>' : '';

    const tail = complete
      ? roundDoneHtml(k, kid)
      : '<div class="next-hint"><span class="gift">🎁</span><span>다음 쿠폰까지 <b>' + nm.need + '일</b> — ' +
        nm.m.emoji + ' ' + rewardTitle(nm.m.type, nm.m.title) + '</span></div>';

    el.streakCard.innerHTML =
      '<div class="card-head"><h2>🔥 연속 성공</h2>' + cycleNote + '<span class="badge">' + k.emoji + ' ' + k.name + '</span></div>' +
      '<div class="streak-hero">' +
        '<div class="flame">' + (streak > 0 ? '🔥' : '🌱') + '</div>' +
        '<div>' + streakLine + '<div class="streak-sub">' + subLine + '</div></div>' +
      '</div>' +
      '<div class="stamps">' + cells + '</div>' +
      '<div class="gauge" aria-hidden="true"><i style="width:' + pct + '%"></i></div>' +
      tail;
  }

  /* 20일 완주 안내 — 도장판 카드 안에서 바로 다음 회차를 시작할 수 있어요. */
  function roundDoneHtml(k, kid){
    if (pendingReset === k.id) {
      return '<div class="round-done">' +
        '<div class="rd-title">🎉 20일 완주! 다음 회차를 시작할까요?</div>' +
        '<div class="rd-confirm">도장판만 0일부터 새로 시작하고, 읽은 책·받아 둔 쿠폰·최고 기록·누적 성공 일수는 그대로 남아요.</div>' +
        '<div class="rd-actions">' +
          '<button class="btn tiny primary" data-action="confirm-new-round" data-kid="' + k.id + '">네, 시작할게요</button>' +
          '<button class="btn tiny" data-action="cancel-new-round">취소</button>' +
        '</div></div>';
    }
    return '<div class="round-done">' +
      '<div class="rd-title">🎉 20일 완주! 쿠폰 4장을 모두 받았어요</div>' +
      '<div class="rd-sub">' + k.emoji + ' ' + esc(k.name) + ' 정말 대단해요 💜 새 회차도 아자아자!</div>' +
      '<div class="rd-actions"><button class="btn warm" style="width:100%" data-action="ask-new-round" data-kid="' + k.id + '">🎉 20일 완주! 다음 회차 시작하기</button></div>' +
    '</div>';
  }

  /* ===================== 렌더: 오늘 날짜 배너 ===================== */
  function renderNewYear(){
    if (!el.newyear) return;
    const now = new Date();
    const d = daysUntil(NY_DAY);          /* 새해까지 남은 날 (당일 0, 지나면 음수) */
    const beforeNY = d > 0;
    const art = beforeNY ? '⛄' : (d === 0 ? '🎉' : '☀️');

    /* 오늘 날짜 — 새해 전에는 괄호로 (새해 D-41), 새해가 되면 괄호 없이 날짜만 */
    const dday = beforeNY ? '<span class="ny-badge">(새해 D-' + d + ')</span>' : '';

    el.newyear.innerHTML =
      '<div class="ny-inner">' +
        '<div class="ny-art" aria-hidden="true">' + art + '</div>' +
        '<div class="ny-main">' +
          '<div class="ny-kicker">📅 오늘</div>' +
          '<div class="ny-row"><div class="ny-date">' + koreanDate(now) + (dday ? ' ' + dday : '') + '</div></div>' +
        '</div>' +
        '<div class="ny-flakes" aria-hidden="true">' +
          '<span style="left:4%;top:10%;animation-delay:0s">❄</span>' +
          '<span style="right:9%;top:14%;animation-delay:.9s">✦</span>' +
          '<span style="right:26%;bottom:16%;animation-delay:1.7s">❄</span>' +
        '</div>' +
      '</div>';
  }

  /* ===================== 렌더: 오늘의 할 일 ===================== */
  let justChecked = null;

  function renderTasks(){
    const k = curKid();
    const kid = kidState(k.id);
    const n = doneCount(kid);
    const success = n >= SUCCESS_NEED;

    const rows = TASKS.map(function(t){
      const on = !!kid.tasks[t.id];
      const stamp = on ? '<span class="stamp' + (justChecked === t.id ? ' soft' : '') + '">완료</span>' : '';
      return '<div class="task' + (on ? ' done' : '') + '">' +
        '<div class="t-emoji">' + t.emoji + '</div>' +
        '<div class="t-label">' + t.label + '</div>' + stamp +
        '<button class="check" data-action="toggle-task" data-task="' + t.id + '" ' +
          'aria-label="' + esc(t.label) + (on ? ' 완료 취소' : ' 완료') + '" aria-pressed="' + on + '">✔</button>' +
      '</div>';
    }).join('');

    const dots = TASKS.map(function(t, i){
      return '<span class="dot' + (kid.tasks[t.id] ? ' on' : '') + (i < SUCCESS_NEED ? ' goal' : '') + '"></span>';
    }).join('');

    const footText = n >= TASKS.length
      ? '오늘 ' + TASKS.length + '개 모두 완료! 최고예요 🎉'
      : (success ? '오늘 성공! ' + n + '개나 해냈어요 🎉' : '성공까지 ' + (SUCCESS_NEED - n) + '개 남았어요');

    el.taskCard.innerHTML =
      '<div class="card-head"><h2>📋 오늘의 할 일</h2><span class="badge">' + n + ' / ' + TASKS.length + '</span></div>' +
      '<div class="task-list">' + rows + '</div>' +
      '<div class="task-foot"><span class="dots">' + dots + '</span><span>' + footText + '</span></div>';
  }

  /* ===================== 값 도우미 ===================== */
  function fmtBook(n){
    return Math.max(0, Math.round(Number(n) || 0)) + '권';
  }

  function clampInt(v, max){
    const n = Math.round(Number(v) || 0);
    if (!isFinite(n)) return 0;
    return Math.max(0, Math.min(max, n));
  }

  /* 누적 책 권수 목표 — 1~9999권, 비었거나 이상하면 기본값 */
  function safeGoal(v, fallback){
    const n = Math.round(Number(v));
    if (!isFinite(n) || n < 1) return fallback;
    return Math.min(9999, n);
  }

  function dayMap(kid, key){
    return (kid && kid[key] && typeof kid[key] === 'object' && !Array.isArray(kid[key])) ? kid[key] : {};
  }

  function ensureDayMap(kid, key){
    if (!kid[key] || typeof kid[key] !== 'object' || Array.isArray(kid[key])) kid[key] = {};
    return kid[key];
  }

  function dayRec(kid, key, d){
    const rec = dayMap(kid, key)[d];
    return (rec && typeof rec === 'object' && !Array.isArray(rec)) ? rec : {};
  }

  function bookToday(kid, id){ return clampInt(dayRec(kid, 'books', todayStr())[id], BOOK_MAX); }

  /* 항목별 합계: sinceStr 을 주면 그 날짜 이후만 셉니다. */
  function itemSum(kid, key, id, sinceStr, max){
    const map = dayMap(kid, key);
    let sum = 0;
    Object.keys(map).forEach(function(d){
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      if (sinceStr && d < sinceStr) return;
      const rec = map[d];
      if (!rec || typeof rec !== 'object') return;
      sum += clampInt(rec[id], max);
    });
    return sum;
  }

  function bookSum(kid, id, sinceStr){ return itemSum(kid, 'books', id, sinceStr, BOOK_MAX); }

  function bookTotal(kid){
    return BOOK_ITEMS.reduce(function(s, it){ return s + bookSum(kid, it.id, null); }, 0);
  }

  function bookDayTotal(kid, d){
    return BOOK_ITEMS.reduce(function(s, it){ return s + clampInt(dayRec(kid, 'books', d)[it.id], BOOK_MAX); }, 0);
  }

  function weekStartStr(){ return dateStr(new Date(Date.now() - 6 * DAY_MS)); }

  /* 이번 달 1일(YYYY-MM-01) — 이번 달 권수 합계의 시작일 */
  function monthStartStr(){
    const d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-01';
  }

  function recentDays(n){
    const out = [];
    for (let i = 0; i < n; i++) out.push(dateStr(new Date(Date.now() - i * DAY_MS)));
    return out;
  }

  function shortDay(d){
    const p = String(d).split('-');
    if (p.length !== 3) return d;
    return Number(p[1]) + '/' + Number(p[2]);
  }

  /* ===================== 렌더: 읽은 책 권수 (권) ===================== */
  let bookBump = '';

  function fmtNum(n){
    return String(Math.max(0, Math.round(Number(n) || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function bookGoal1(){ return Math.max(1, Math.round(Number(state.settings.goal1) || GOAL_DEFAULT_1)); }
  function bookGoal2(){ return Math.max(bookGoal1() + 1, Math.round(Number(state.settings.goal2) || GOAL_DEFAULT_2)); }

  /* 누적(영어책+한글책) 권수와 다음 목표 — 500권을 넘으면 다음은 1,000권을 보여 줍니다. */
  function bookGoalHtml(kid){
    const total = bookTotal(kid);
    const g1 = bookGoal1();
    const g2 = bookGoal2();
    const hit1 = total >= g1;
    const hit2 = total >= g2;
    const target = hit1 ? g2 : g1;
    const pct = Math.max(0, Math.min(100, Math.floor((total / target) * 100)));
    let banners = '';
    if (hit1) banners += '<div class="bgoal-banner t1">🎉 누적 ' + fmtNum(g1) + '권 목표 달성!</div>';
    if (hit2) banners += '<div class="bgoal-banner t2">🏆 누적 ' + fmtNum(g2) + '권 목표 달성! 정말 대단해요</div>';
    return '<div class="bgoal">' +
      '<div class="bgoal-row"><span>누적</span><span class="now">' + fmtNum(total) + '</span>' +
        '<span>/ <span class="goal">' + fmtNum(target) + '권</span></span>' +
        (hit1 && hit2 ? '' : '<span class="pct">' + pct + '%</span>') + '</div>' +
      '<div class="bgoal-bar' + (hit1 ? ' done' : '') + '" aria-hidden="true"><i style="width:' + pct + '%"></i></div>' +
      banners +
    '</div>';
  }

  /* 목표에 막 닿은 순간 한 번만 축하 알림 — 이미 지나 있으면 배너만 남습니다. */
  function checkBookGoal(kid, beforeTotal){
    const total = bookTotal(kid);
    const tiers = [{ t:1, g:bookGoal1() }, { t:2, g:bookGoal2() }];
    const done = (kid.goalDone && typeof kid.goalDone === 'object') ? kid.goalDone : {};
    const crossed = [];
    tiers.forEach(function(x){
      if (beforeTotal < x.g && total >= x.g && Number(done['t' + x.t]) !== x.g) crossed.push(x);
    });
    if (!crossed.length) return;
    const next = Object.assign({}, done);
    crossed.forEach(function(x){ next['t' + x.t] = x.g; });
    kid.goalDone = next;
    save();
    showBookGoalPop(crossed);
  }

  function showBookGoalPop(crossed){
    const list = crossed.slice().sort(function(a, b){ return b.t - a.t; });
    const top = list[0];
    const lines = list.map(function(x){ return (x.t === 1 ? '1차' : '2차') + ' 목표 ' + fmtNum(x.g) + '권'; }).join(' · ');
    el.highfiveContent.innerHTML =
      '<span class="hero">🎉</span>' +
      '<h2>누적 ' + fmtNum(top.g) + '권 달성!</h2>' +
      '<p>📚 ' + lines + '을 채웠어요!<br>영어책·한글책을 꾸준히 읽은 힘이에요 💜</p>' +
      '<div class="reward">🏅 다음 목표도 아자아자!</div>' +
      '<button class="btn primary" data-action="close-highfive">좋아!</button>';
    el.highfive.hidden = false;
    confetti(el.highfiveContent);
    playChime();
    buzz([120, 70, 120, 70, 260]);
    toast('🎉 누적 ' + fmtNum(top.g) + '권 목표 달성!');
  }

  function renderBooks(){
    if (!el.bookCard) return;
    const k = curKid();
    const kid = kidState(k.id);
    const t = todayStr();
    const days = recentDays(5);
    const weekStart = weekStartStr();
    const monthStart = monthStartStr();
    const monthTotal = BOOK_ITEMS.reduce(function(sum, it){ return sum + bookSum(kid, it.id, monthStart); }, 0);

    const items = BOOK_ITEMS.map(function(it){
      const today = bookToday(kid, it.id);
      const week = bookSum(kid, it.id, weekStart);
      const month = bookSum(kid, it.id, monthStart);
      const quick = BOOK_QUICK.map(function(n){
        return '<button class="io-q plus" data-action="book-add" data-item="' + it.id + '" data-n="' + n + '">+' + n + '권</button>';
      }).join('') +
      '<button class="io-q minus" data-action="book-add" data-item="' + it.id + '" data-n="-1">−1권</button>';

      return '<div class="io-item">' +
        '<div class="io-top">' +
          '<span class="io-emoji" aria-hidden="true">' + it.emoji + '</span>' +
          '<span class="io-name">' + esc(it.label) + '</span>' +
          '<span class="io-today' + (bookBump === it.id ? ' bump' : '') + '" data-item="' + it.id + '"><b>' + today + '</b>권</span>' +
        '</div>' +
        '<div class="io-sub" data-item="' + it.id + '">이번 주 <b>' + fmtBook(week) + '</b> · 이번 달 <b>' + fmtBook(month) + '</b></div>' +
        '<div class="io-quick three">' + quick + '</div>' +
        '<div class="io-set">' +
          '<input type="number" id="book-' + it.id + '" data-item="' + it.id + '" min="0" max="' + BOOK_MAX + '" step="1" inputmode="numeric" ' +
            'value="' + today + '" aria-label="' + esc(it.label) + ' 오늘 권수 입력 — 입력하면 바로 저장돼요">' +
          '<span class="u">권</span>' +
          '<button class="io-del" data-action="book-clear" data-item="' + it.id + '">지우기</button>' +
        '</div>' +
      '</div>';
    }).join('');

    const head = '<tr><th>날짜</th>' +
      BOOK_ITEMS.map(function(it){ return '<th>' + esc(it.short) + '</th>'; }).join('') + '<th>합계</th></tr>';

    const body = days.map(function(d){
      let sum = 0;
      const cells = BOOK_ITEMS.map(function(it){
        const v = clampInt(dayRec(kid, 'books', d)[it.id], BOOK_MAX);
        sum += v;
        return '<td class="' + (v ? '' : 'zero') + '">' + (v ? v : '·') + '</td>';
      }).join('');
      return '<tr class="' + (d === t ? 'is-today' : '') + '">' +
        '<td>' + (d === t ? '오늘' : shortDay(d)) + '</td>' + cells +
        '<td class="total' + (sum ? '' : ' zero') + '">' + (sum ? sum : '·') + '</td></tr>';
    }).join('');

    el.bookCard.innerHTML =
      '<div class="card-head"><h2>📚 읽은 책</h2><span class="badge">이번 달 ' + fmtBook(monthTotal) + '</span></div>' +
      bookGoalHtml(kid) +
      '<div class="io-list">' + items + '</div>' +
      '<div class="io-hist">' +
        '<p class="io-hist-head">최근 5일 <span>단위: 권</span></p>' +
        '<table class="io-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>' +
      '</div>' +
      '<p class="io-foot">읽은 책을 한 권씩 더해 두면 이번 주·이번 달 권수가 저절로 쌓여요.</p>';

    bookBump = '';
  }

  /* ===================== 동작: 권수 ===================== */

  function bookAdd(itemId, delta){
    if (!BOOK_ITEMS.some(function(x){ return x.id === itemId; })) return;
    const k = curKid();
    const kid = kidState(k.id);
    const beforeTotal = bookTotal(kid);
    const t = todayStr();
    const map = ensureDayMap(kid, 'books');
    const rec = Object.assign({}, dayRec(kid, 'books', t));
    const before = clampInt(rec[itemId], BOOK_MAX);
    const next = clampInt(before + (Number(delta) || 0), BOOK_MAX);
    if (next === before) {
      if (before === 0) toast('오늘은 아직 0권이에요. 직접 입력해도 좋아요!');
      return;
    }
    if (next > 0) rec[itemId] = next;
    else delete rec[itemId];
    if (Object.keys(rec).length) map[t] = rec;
    else delete map[t];
    bookBump = itemId;
    save();
    renderBooks();
    playTick();
    checkBookGoal(kid, beforeTotal);
  }

  /* 숫자칸에 적는 즉시 저장 — 저장 버튼 없이 오늘 권수를 반영합니다. */
  function bookRecord(itemId, value){
    if (!BOOK_ITEMS.some(function(x){ return x.id === itemId; })) return 0;
    const kid = kidState();
    const beforeTotal = bookTotal(kid);
    const t = todayStr();
    const map = ensureDayMap(kid, 'books');
    const rec = Object.assign({}, dayRec(kid, 'books', t));
    const v = clampInt(value, BOOK_MAX);
    if (v > 0) rec[itemId] = v;
    else delete rec[itemId];
    if (Object.keys(rec).length) map[t] = rec;
    else delete map[t];
    save();
    checkBookGoal(kid, beforeTotal);
    return v;
  }

  /* 입력 중에는 카드를 다시 그리지 않고 숫자만 새로 고칩니다(커서가 튀지 않게). */
  function refreshBookStats(){
    if (!el.bookCard) return;
    const kid = kidState();
    const weekStart = weekStartStr();
    const monthStart = monthStartStr();
    let monthTotal = 0;

    BOOK_ITEMS.forEach(function(it){
      const week = bookSum(kid, it.id, weekStart);
      const month = bookSum(kid, it.id, monthStart);
      monthTotal += month;
      const sub = el.bookCard.querySelector('.io-sub[data-item="' + it.id + '"]');
      if (sub) sub.innerHTML = '이번 주 <b>' + fmtBook(week) + '</b> · 이번 달 <b>' + fmtBook(month) + '</b>';
      const top = el.bookCard.querySelector('.io-today[data-item="' + it.id + '"] b');
      if (top) top.textContent = String(bookToday(kid, it.id));
    });

    const badge = el.bookCard.querySelector('.card-head .badge');
    if (badge) badge.textContent = '이번 달 ' + fmtBook(monthTotal);

    const strip = el.bookCard.querySelector('.bgoal');
    if (strip) strip.outerHTML = bookGoalHtml(kid);

    const row = el.bookCard.querySelector('.io-table tr.is-today');
    if (row) {
      const tds = row.querySelectorAll('td');
      let sum = 0;
      BOOK_ITEMS.forEach(function(it, i){
        const v = bookToday(kid, it.id);
        sum += v;
        const td = tds[i + 1];
        if (td) { td.textContent = v ? v : '·'; td.className = v ? '' : 'zero'; }
      });
      const last = tds[tds.length - 1];
      if (last) { last.textContent = sum ? sum : '·'; last.className = 'total' + (sum ? '' : ' zero'); }
    }
  }

  function bookTyped(itemId, input){
    bookRecord(itemId, input ? input.value : 0);
    refreshBookStats();
  }

  function bookCommitted(itemId, input){
    const v = bookRecord(itemId, input ? input.value : 0);
    /* 확정될 때는 값을 다듬기만 하고 카드를 다시 그리지 않아요.
       (다시 그리면 입력칸 옆 +권 버튼을 누르려는 순간 버튼이 사라져 클릭이 먹히지 않습니다) */
    if (input && String(input.value) !== String(v)) input.value = String(v);
    refreshBookStats();
  }

  function bookClear(itemId){
    const k = curKid();
    const kid = kidState(k.id);
    const t = todayStr();
    const cur = bookToday(kid, itemId);
    if (!cur) { toast('오늘 기록이 아직 없어요'); return; }
    const it = BOOK_ITEMS.filter(function(x){ return x.id === itemId; })[0];
    if (!confirm(k.name + ' 오늘 ' + it.label + ' ' + fmtBook(cur) + ' 기록을 지울까요?')) return;
    const map = ensureDayMap(kid, 'books');
    const rec = Object.assign({}, dayRec(kid, 'books', t));
    delete rec[itemId];
    if (Object.keys(rec).length) map[t] = rec;
    else delete map[t];
    save();
    renderBooks();
    toast('오늘 ' + it.label + ' 기록을 지웠어요');
  }

  /* ===================== 렌더: 쿠폰함 ===================== */
  let pendingUse = null;

  function renderCoupons(){
    const k = curKid();
    const kid = kidState(k.id);
    const list = kid.coupons;
    const usable = list.filter(function(c){ return !c.used; });

    let body = '';
    if (!list.length) {
      body = '<div class="empty"><span class="big">🎫</span>아직 쿠폰이 없어요.<br>5일·10일·15일·20일 연속 성공하면 쿠폰이 짠!</div>';
    } else {
      body = '<div class="coupon-list">' + list.map(function(c){
        const confirming = pendingUse === c.id;
        const type = c.type || 'free';
        let action;
        if (c.used) {
          action = '';
        } else if (confirming) {
          action = '<button class="use-btn" data-action="confirm-use" data-id="' + c.id + '">쓸래요!</button>' +
                   '<button class="use-btn ghost" data-action="cancel-use" data-id="' + c.id + '">취소</button>';
        } else {
          action = '<button class="use-btn" data-action="use-coupon" data-id="' + c.id + '">사용하기</button>';
        }
        return '<div class="coupon ' + type + (c.used ? ' used' : '') + '">' +
          (c.used ? '<span class="used-stamp">사용완료</span>' +
            '<button class="undo" data-action="undo-coupon" data-id="' + c.id + '">되돌리기</button>' : '') +
          '<div class="c-emoji">' + c.emoji + '</div>' +
          '<div class="c-body">' +
            '<div class="c-title">' + esc(rewardTitle(type, c.title)) +
              (c.streakAt ? '<span class="c-tag ' + type + '">' + c.streakAt + '일</span>' : '') +
            '</div>' +
            '<div class="c-meta">' + (c.used ? '사용일 ' + shortDate(c.usedAt) : '받은 날 ' + shortDate(c.issuedAt) + ' · 연속 ' + (c.streakAt || '') + '일') + '</div>' +
          '</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:50%">' + action + '</div>' +
        '</div>';
      }).join('') + '</div>';
    }

    el.couponCard.innerHTML =
      '<div class="card-head"><h2>🎟️ ' + k.name + ' 쿠폰함</h2><span class="badge">쓸 수 있는 쿠폰 ' + usable.length + '장</span></div>' + body;
  }

  /* ===================== 렌더: 가족 미션 =====================
     성공 도장을 받을 때마다 뽑기 1번이 열립니다(두 아이가 각각 받으면 하루 최대 2번). */
  function renderMission(){
    const k = curKid();
    const kid = kidState(k.id);
    const m = state.mission;
    const has = !!m.text;
    const left = drawsLeft(kid);
    const pickedBy = m.by ? KIDS.filter(function(x){ return x.id === m.by; })[0] : null;
    let box;

    if (!has) {
      if (left > 0) {
        box = '<div class="mission-box"><div class="mission-text">오늘의 가족 미션을 뽑아 볼까요?</div>' +
              '<div class="mission-sub">' + k.emoji + ' ' + esc(k.name) + ' 뽑기 <b>' + left + '번</b> 열렸어요</div>' +
              '<div class="mission-actions"><button class="btn warm" data-action="draw-mission">🎲 미션 뽑기</button></div></div>';
      } else {
        box = '<div class="mission-box locked"><div class="mission-text">오늘 도장을 받으면 미션을 뽑을 수 있어요</div>' +
              '<div class="mission-sub">' + (stampedToday(kid)
                ? '오늘 몫은 다 뽑았어요 · 다음 도장을 받으면 또 열려요'
                : '할 일 ' + TASKS.length + '개 중 ' + SUCCESS_NEED + '개를 하면 도장이 쾅!') + '</div>' +
              '<div class="mission-actions"><button class="btn" disabled>🎲 미션 뽑기</button></div></div>';
      }
    } else {
      box = '<div class="mission-box"><div class="mission-text' + (m.done ? ' done' : '') + '">' +
        (m.done ? '✅ ' : '') + esc(m.text) + '</div>' +
        '<div class="mission-sub">' + (pickedBy ? pickedBy.emoji + ' ' + esc(pickedBy.name) + ' 뽑음 · ' : '') +
          '남은 뽑기 <b>' + left + '번</b></div>' +
        '<div class="mission-actions">' +
          (m.done ? '' : '<button class="btn primary" data-action="complete-mission">✅ 미션 완료!</button>') +
          (left > 0 ? '<button class="btn" data-action="draw-mission">🔁 다른 미션 뽑기</button>' : '') +
        '</div></div>';
    }

    const customCount = state.missions.filter(function(x){ return x.custom; }).length;
    const badge = left > 0
      ? '<span class="badge">🎲 뽑기 ' + left + '번</span>'

    el.missionCard.innerHTML =
      '<div class="card-head"><h2>💌 가족 랜덤 미션</h2>' + badge + '</div>' +
      box +

        '<button class="btn tiny" data-action="add-mission">추가</button></div>' +
      (customCount ? '<p class="set-help" style="margin-top:8px">직접 추가한 미션 ' + customCount + '개는 아래 부모 설정에서 지울 수 있어요.</p>' : '');
  }

  /* ===================== 영어 퀴즈: 날짜별 출제 ===================== */
  let quiz = loadQuiz();
  let quizView = 'today';

  function emptyQuizSlot(setIndex){
    const answers = [];
    for (let i = 0; i < QUIZ_PER_DAY; i++) answers.push(null);
    return { set: setIndex, answers: answers, graded: false, score: 0 };
  }

  function validQuizSlot(slot){
    if (!slot || typeof slot !== 'object') return null;
    const set = Number(slot.set);
    if (!isFinite(set) || set < 0 || set >= QUIZ_DAYS) return null;
    const from = Array.isArray(slot.answers) ? slot.answers : [];
    const answers = [];
    for (let i = 0; i < QUIZ_PER_DAY; i++) {
      const a = from[i];
      const n = Number(a);
      answers.push((a === null || a === undefined || a === '' || isNaN(n) || n < 0 || n > 3) ? null : Math.floor(n));
    }
    const complete = answers.every(function(a){ return a !== null; });
    const graded = !!slot.graded && complete;
    const score = graded ? Math.max(0, Math.min(QUIZ_PER_DAY, Math.round(Number(slot.score) || 0))) : 0;
    return { set: Math.floor(set), answers: answers, graded: graded, score: score };
  }

  function quizDayNumber(d){
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY_MS);
  }

  function todaySetIndex(){
    const n = quizDayNumber(new Date());
    return ((n % QUIZ_DAYS) + QUIZ_DAYS) % QUIZ_DAYS;
  }

  function quizQuestions(setIndex){
    const start = setIndex * QUIZ_PER_DAY;
    return QUIZ_BANK.slice(start, start + QUIZ_PER_DAY);
  }

  function loadQuiz(){
    const base = { v:1, kids:{} };
    KIDS.forEach(function(k){ base.kids[k.id] = null; });
    let saved = null;
    try {
      const raw = localStorage.getItem(QUIZ_KEY);
      if (raw) saved = JSON.parse(raw);
    } catch (e) { return base; }
    if (!saved || typeof saved !== 'object' || !saved.kids || typeof saved.kids !== 'object') return base;
    KIDS.forEach(function(k){
      const one = saved.kids[k.id];
      if (one && typeof one === 'object') base.kids[k.id] = one;
    });
    return base;
  }

  function saveQuiz(){
    try { localStorage.setItem(QUIZ_KEY, JSON.stringify(quiz)); } catch (e) {}
  }

  function resetQuizKid(kidId){
    quiz.kids[kidId] = { date: todayStr(), today: emptyQuizSlot(todaySetIndex()), practice: null };
    return quiz.kids[kidId];
  }

  function ensureQuiz(){
    const t = todayStr();
    if (!quiz || !quiz.kids || typeof quiz.kids !== 'object') quiz = { v:1, kids:{} };
    let changed = false;
    KIDS.forEach(function(k){
      const from = quiz.kids[k.id];
      if (!from || typeof from !== 'object' || from.date !== t) {
        resetQuizKid(k.id);
        changed = true;
        return;
      }
      const fixed = {
        date: t,
        today: validQuizSlot(from.today) || emptyQuizSlot(todaySetIndex()),
        practice: from.practice ? validQuizSlot(from.practice) : null
      };
      if (JSON.stringify(fixed) !== JSON.stringify(from)) { quiz.kids[k.id] = fixed; changed = true; }
    });
    if (changed) saveQuiz();
    return quiz.kids[state.active];
  }

  function quizShowingPractice(){
    const kq = quiz.kids[state.active];
    return quizView === 'practice' && !!(kq && kq.practice);
  }

  function currentQuizSlot(){
    const kq = ensureQuiz();
    if (!kq) return null;
    return quizShowingPractice() ? kq.practice : kq.today;
  }

  function renderQuiz(){
    if (!el.quizCard) return;
    const kq = ensureQuiz();
    const k = curKid();
    if (!kq) { el.quizCard.innerHTML = ''; return; }

    const practice = quizShowingPractice();
    const slot = practice ? kq.practice : kq.today;
    const qs = quizQuestions(slot.set);
    const answered = slot.answers.filter(function(a){ return a !== null; }).length;

    const bookKeys = [];
    qs.forEach(function(q){ if (bookKeys.indexOf(q.book) < 0) bookKeys.push(q.book); });
    const books = bookKeys.map(function(b){
      const meta = QUIZ_BOOKS[b] || { label:b, emoji:'📘' };
      return '<span class="book">' + meta.emoji + ' ' + esc(meta.label) + '</span>';
    }).join('');

    const head = '<div class="card-head"><h2>' + (practice ? '📚 연습 영어 퀴즈' : '📚 오늘의 영어 퀴즈') + '</h2>' +
      '<span class="badge">' + k.emoji + ' ' + esc(k.name) + '</span></div>';

    const meta = '<div class="quiz-meta">' + books +
      '<span class="muted">' + (practice ? '연습 세트' : '오늘의 세트') + ' ' + (slot.set + 1) + ' / ' + QUIZ_DAYS + '</span>' +
      (practice && kq.today.graded ? '<span class="muted">· 오늘 퀴즈 ' + kq.today.score + '/' + QUIZ_PER_DAY + '</span>' : '') +
      '</div>';

    const marks = ['①', '②', '③', '④'];
    const items = qs.map(function(q, qi){
      const picked = slot.answers[qi];
      const opts = q.options.map(function(text, oi){
        let cls = 'q-opt';
        if (!slot.graded) {
          if (picked === oi) cls += ' sel';
        } else if (oi === q.answer) {
          cls += ' ok mark';
        } else if (picked === oi) {
          cls += ' no mark';
        }
        return '<button type="button" class="' + cls + '" data-action="quiz-pick" data-q="' + qi + '" data-o="' + oi + '"' +
          (slot.graded ? ' disabled' : '') + ' aria-pressed="' + (picked === oi) + '">' +
          '<span class="k">' + marks[oi] + '</span><span class="t">' + esc(text) + '</span></button>';
      }).join('');

      let explain = '';
      if (slot.graded) {
        explain = '<div class="q-explain"><b>정답 ' + (q.answer + 1) + '번</b> · ' + esc(q.explain) + '</div>';
      }

      const bm = QUIZ_BOOKS[q.book] || { label:q.book, emoji:'📘' };
      return '<div class="q-item">' +
        '<div class="q-head"><span class="q-no">' + (qi + 1) + '</span>' +
          '<span class="q-chip book">' + bm.emoji + ' ' + esc(bm.label) + '</span>' +
          '<span class="q-chip ' + (q.type === '단어' ? 'word' : 'read') + '">' + esc(q.type) + '</span>' +
        '</div>' +
        '<p class="q-text">' + esc(q.q) + '</p>' + opts + explain +
      '</div>';
    }).join('');

    let scoreHtml = '';
    if (slot.graded) {
      let msg;
      if (slot.score === QUIZ_PER_DAY) msg = '🎉 만점! 오늘 퀴즈를 완벽하게 풀었어요!';
      else if (slot.score === QUIZ_PER_DAY - 1) msg = '💜 아주 잘했어요! 하나만 더 맞히면 만점!';
      else if (slot.score === 3) msg = '👏 좋아요! 해설을 읽고 다시 도전해 봐요.';
      else msg = '💪 괜찮아요! 해설을 읽으면 다음엔 더 잘할 수 있어요.';
      scoreHtml = '<div class="quiz-score"><span class="num"><b>' + slot.score + '</b> / ' + QUIZ_PER_DAY + '점</span>' +
        '<span class="msg">' + msg + '</span></div>';
    }

    let actions;
    if (!slot.graded) {
      actions = '<button class="btn primary" data-action="quiz-grade"' + (answered === QUIZ_PER_DAY ? '' : ' disabled') + '>' +
        '📝 채점하기 (' + answered + '/' + QUIZ_PER_DAY + ')</button>';
    } else {
      actions = '<button class="btn primary" data-action="quiz-retry">🔁 다시 풀기</button>';
    }
    actions += practice
      ? '<button class="btn" data-action="quiz-today">📅 오늘 퀴즈로</button>'
      : '<button class="btn" data-action="quiz-practice">🔄 연습 문제 더 풀기</button>';

    const hint = slot.graded
      ? '점수와 해설은 이 기기에 저장돼요. 날짜가 바뀌면 새 5문제가 나와요.'
      : '5문제를 모두 고르면 채점 버튼이 켜져요.';

    el.quizCard.innerHTML = head + meta + items + scoreHtml +
      '<div class="quiz-actions">' + actions + '</div>' +
      '<p class="quiz-hint">' + hint + '</p>';
  }

  function pickQuizAnswer(qi, oi){
    const slot = currentQuizSlot();
    if (!slot || slot.graded) return;
    if (!(qi >= 0 && qi < QUIZ_PER_DAY) || !(oi >= 0 && oi < 4)) return;
    slot.answers[qi] = oi;
    saveQuiz();
    renderQuiz();
  }

  function gradeQuizNow(){
    const slot = currentQuizSlot();
    if (!slot || slot.graded) return;
    if (slot.answers.some(function(a){ return a === null; })) { toast('5문제를 모두 골라 주세요 🙂'); return; }
    const qs = quizQuestions(slot.set);
    let score = 0;
    for (let i = 0; i < qs.length; i++) { if (slot.answers[i] === qs[i].answer) score++; }
    slot.graded = true;
    slot.score = score;
    saveQuiz();
    renderQuiz();
    if (score === QUIZ_PER_DAY) {
      playChime();
      confetti(document.body);
      buzz([90, 60, 90, 60, 200]);
      toast('🎉 만점! 5 / 5점이에요!');
    } else if (score >= 3) {
      playStamp();
      toast('👏 ' + score + ' / 5점! 해설도 읽어 봐요');
    } else {
      toast('💪 ' + score + ' / 5점! 해설을 보면 다음엔 더 잘할 수 있어요');
    }
    /* 오늘 퀴즈를 채점했다면 '오늘의 퀴즈 풀기' 할 일도 함께 체크해 줍니다.
       (직접 체크하거나 풀 수도 있고, 체크 표시를 다시 눌러 되돌릴 수도 있어요) */
    if (!quizShowingPractice()) autoCheckQuizTask();
  }

  /* '오늘의 퀴즈 풀기' 할 일을 채점과 연결 — 이미 체크돼 있으면 그대로 둡니다. */
  function autoCheckQuizTask(){
    const kid = kidState();
    if (!kid || kid.tasks.quiz) return;
    toggleTask('quiz');
  }

  function retryQuiz(){
    const slot = currentQuizSlot();
    if (!slot) return;
    slot.answers = emptyQuizSlot(slot.set).answers;
    slot.graded = false;
    slot.score = 0;
    saveQuiz();
    renderQuiz();
    toast('다시 풀어 볼까요? 화이팅! 💜');
  }

  function startPracticeQuiz(){
    const kq = ensureQuiz();
    if (!kq) return;
    if (kq.practice && !kq.practice.graded) {
      quizView = 'practice';
      renderQuiz();
      return;
    }
    const todaySet = kq.today.set;
    let next = ((kq.practice ? kq.practice.set : todaySet) + 1) % QUIZ_DAYS;
    let guard = 0;
    while (next === todaySet && guard < QUIZ_DAYS) { next = (next + 1) % QUIZ_DAYS; guard++; }
    kq.practice = emptyQuizSlot(next);
    quizView = 'practice';
    saveQuiz();
    renderQuiz();
    toast('🔄 다른 날의 5문제를 준비했어요');
  }

  function backToTodayQuiz(){
    quizView = 'today';
    renderQuiz();
  }

    if (view === 'home') layoutCards();

  function confetti(host){
    const chars = ['🎉','✨','🎊','💜','⭐','🌟','💫','🎈'];
    for (let i = 0; i < 16; i++) {
      const s = document.createElement('span');
      s.className = 'confetti';
      s.textContent = chars[i % chars.length];
      s.style.left = (6 + Math.random() * 88) + '%';
      s.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
      s.style.fontSize = (14 + Math.random() * 12).toFixed(0) + 'px';
      host.appendChild(s);
      setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 2600);
    }
  }

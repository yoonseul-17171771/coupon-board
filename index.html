  /* ===================== 렌더: 흘려듣기 (분) ===================== */
  let listenBump = false;

  function fmtMin(m){
    const v = Math.max(0, Math.round(Number(m) || 0));
    if (v < 60) return v + '분';
    const h = Math.floor(v / 60);
    const r = v % 60;
    return h + '시간' + (r ? ' ' + r + '분' : '');
  }

  function listenMap(kid){
    return (kid.listen && typeof kid.listen === 'object' && !Array.isArray(kid.listen)) ? kid.listen : {};
  }

  function listenToday(kid){
    const v = Math.round(Number(listenMap(kid)[todayStr()]));
    return isFinite(v) && v > 0 ? v : 0;
  }

  function listenSum(kid, sinceStr){
    const map = listenMap(kid);
    let sum = 0;
    Object.keys(map).forEach(function(d){
      if (sinceStr && d < sinceStr) return;
      const v = Math.round(Number(map[d]));
      if (isFinite(v) && v > 0) sum += v;
    });
    return sum;
  }

  function listenWeekStart(){ return dateStr(new Date(Date.now() - 6 * DAY_MS)); }

  function shortDay(d){
    const p = String(d).split('-');
    if (p.length !== 3) return d;
    return Number(p[1]) + '/' + Number(p[2]);
  }

  function renderListen(){
    if (!el.listenCard) return;
    const k = curKid();
    const kid = kidState(k.id);
    const map = listenMap(kid);
    const t = todayStr();
    const today = listenToday(kid);
    const week = listenSum(kid, listenWeekStart());
    const total = Math.max(listenSum(kid, null), Math.round(Number(sheetTotals[k.name]) || 0));

    const recent = Object.keys(map)
      .filter(function(d){ const v = Math.round(Number(map[d])); return isFinite(v) && v > 0; })
      .sort()
      .reverse()
      .slice(0, 5)
      .map(function(d){
        const isToday = d === t;
        return '<span class="l-chip' + (isToday ? ' today' : '') + '">' +
          (isToday ? '오늘' : shortDay(d)) + ' ' + Math.round(Number(map[d])) + '분</span>';
      }).join('');

    const quick = LISTEN_QUICK.map(function(m){
      return '<button class="l-quick" data-action="listen-add" data-min="' + m + '">+' + m + '분</button>';
    }).join('');

    el.listenCard.innerHTML =
      '<div class="card-head"><h2>🎧 흘려듣기</h2><span class="badge">누적 ' + fmtMin(total) + '</span></div>' +
      '<div class="listen-hero">' +
        '<div class="listen-min' + (listenBump ? ' bump' : '') + '">' +
          '<b>' + today + '</b><span class="u">분</span>' +
        '</div>' +
        '<div class="listen-sub"><b>' + k.emoji + ' ' + k.name + ' 오늘</b><br>' +
          '<span class="listen-week">이번 주 ' + fmtMin(week) + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="listen-quick">' + quick + '</div>' +
      '<div class="listen-set">' +
        '<span class="l-lab">직접 입력</span>' +
        '<input type="number" id="listenMinutes" min="0" max="' + LISTEN_MAX + '" step="1" inputmode="numeric" ' +
          'value="' + (today > 0 ? today : '') + '" placeholder="몇 분" aria-label="오늘 흘려듣기 분">' +
        '<span class="u">분</span>' +
        '<button class="btn tiny primary" data-action="listen-set">저장</button>' +
      '</div>' +
      (recent
        ? '<div class="listen-recent"><span class="l-lab">최근</span>' + recent + '</div>'
        : '<p class="listen-note">오늘 몇 분 흘려들었는지 위 버튼을 누르거나 직접 입력해 두면, 여기에 날짜별로 쌓여요.</p>') +
      '<div class="listen-tools">' +
        '<button class="l-link" data-action="listen-add" data-min="-10">−10분</button>' +
        '<button class="l-link" data-action="listen-clear">오늘 기록 지우기</button>' +
      '</div>';

    listenBump = false;
  }

  /* ===================== 동작: 흘려듣기 (분) ===================== */
  function ensureListenMap(kid){
    if (!kid.listen || typeof kid.listen !== 'object' || Array.isArray(kid.listen)) kid.listen = {};
    return kid.listen;
  }

  /* 빠른 버튼(+10/+20/+30/−10): 오늘 분 수에 더하거나 뻘니다. */
  function listenAdd(delta){
    const k = curKid();
    const kid = kidState(k.id);
    const map = ensureListenMap(kid);
    const t = todayStr();
    const before = Math.round(Number(map[t]) || 0);
    const next = Math.max(0, Math.min(LISTEN_MAX, before + (Number(delta) || 0)));
    if (next === before) {
      if (before === 0) toast('오늘은 아직 0분이에요. 직접 입력해도 좋아요!');
      return;
    }
    map[t] = next;
    listenBump = true;
    saveAndSync(k.id);
    renderListen();
    playTick();
  }

  /* 직접 입력 + 저장: 오늘 분 수를 입력한 값으로 맞춥니다. */
  function listenSet(val){
    const k = curKid();
    const kid = kidState(k.id);
    const raw = String(val == null ? '' : val).trim();
    if (!raw) { toast('몇 분인지 먼저 적어 주세요'); return; }
    const map = ensureListenMap(kid);
    const t = todayStr();
    const v = Math.max(0, Math.min(LISTEN_MAX, Math.round(Number(raw) || 0)));
    if (v > 0) map[t] = v;
    else delete map[t];
    saveAndSync(k.id);
    renderListen();
    playTick();
    toast('🎧 오늘 흘려듣기 ' + fmtMin(v) + ' 저장!');
  }

  function listenClear(){
    const k = curKid();
    const kid = kidState(k.id);
    const t = todayStr();
    const cur = listenToday(kid);
    if (!cur) { toast('오늘 기록이 아직 없어요'); return; }
    if (!confirm(k.name + ' 오늘 흘려듣기 ' + cur + '분 기록을 지울까요?')) return;
    ensureListenMap(kid);
    delete kid.listen[t];
    saveAndSync(k.id);
    renderListen();
    toast('오늘 흘려듣기 기록을 지웠어요');
  }

  /* ===================== 렌더: 쿠폰함 ===================== */
  let pendingUse = null;

  function renderCoupons(){
    const k = curKid();
    const kid = kidState(k.id);
    const list = kid.coupons;
    const usable = list.filter(function(c){ return !c.used; });

    let body = '';
    if (!list.length) {
      body = '<div class="empty"><span class="big">🎫</span>아직 쿠폰이 없어요.<br>7일·10일·15일 연속 성공하면 쿠폰이 짠!</div>';
    } else {
      body = '<div class="coupon-list">' + list.map(function(c){
        const confirming = pendingUse === c.id;
        const type = c.type || 'free';
        let action;
        if (c.used) {
          action = '';
        } else if (confirming) {
          action = '<button class="use-btn" data-action="confirm-use" data-id="' + c.id + '">쓸래요!</button>' +
                   '<button class="use-btn ghost" data-action="cancel-use" data-id="' + c.id + '">취소</button>';
        } else {
          action = '<button class="use-btn" data-action="use-coupon" data-id="' + c.id + '">사용하기</button>';
        }
        return '<div class="coupon ' + type + (c.used ? ' used' : '') + '">' +
          (c.used ? '<span class="used-stamp">사용완료</span>' +
            '<button class="undo" data-action="undo-coupon" data-id="' + c.id + '">되돌리기</button>' : '') +
          '<div class="c-emoji">' + c.emoji + '</div>' +
          '<div class="c-body">' +
            '<div class="c-title">' + esc(c.title) + '</div>' +
            '<div class="c-meta">' + (c.used ? '사용일 ' + shortDate(c.usedAt) : '받은 날 ' + shortDate(c.issuedAt) + ' · 연속 ' + (c.streakAt || '') + '일') + '</div>' +
          '</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:50%">' + action + '</div>' +
        '</div>';
      }).join('') + '</div>';
    }

    el.couponCard.innerHTML =
      '<div class="card-head"><h2>🎟️ ' + k.name + ' 쿠폰함</h2><span class="badge">쓸 수 있는 쿠폰 ' + usable.length + '장</span></div>' + body;
  }

  /* ===================== 렌더: 가족 미션 ===================== */
  function renderMission(){
    const m = state.mission;
    const has = !!m.text;
    let box;
    if (!has) {
      box = '<div class="mission-box"><div class="mission-text">오늘의 가족 미션을 뽑아 볼까요?</div>' +
            '<div class="mission-actions"><button class="btn warm" data-action="draw-mission">🎲 미션 뽑기</button></div></div>';
    } else {
      box = '<div class="mission-box"><div class="mission-text' + (m.done ? ' done' : '') + '">' +
        (m.done ? '✅ ' : '') + esc(m.text) + '</div>' +
        '<div class="mission-actions">' +
          (m.done
            ? '<button class="btn" data-action="draw-mission">🔁 다른 미션 뽑기</button>'
            : '<button class="btn primary" data-action="complete-mission">✅ 미션 완료!</button>' +
              '<button class="btn" data-action="draw-mission">🔁 다시 뽑기</button>') +
        '</div></div>';
    }

    const customCount = state.missions.filter(function(x){ return x.custom; }).length;

    el.missionCard.innerHTML =
      '<div class="card-head"><h2>💌 가족 랜덤 미션</h2><span class="badge">' + state.missions.length + '개 중 1개</span></div>' +
      box +
      '<div class="add-row"><input type="text" id="missionInput" maxlength="40" placeholder="우리 가족만의 미션을 추가해요" aria-label="새 미션">' +
        '<button class="btn tiny" data-action="add-mission">추가</button></div>' +
      (customCount ? '<p class="set-help" style="margin-top:8px">직접 추가한 미션 ' + customCount + '개는 아래 부모 설정에서 지울 수 있어요.</p>' : '');
  }

  /* ===================== 영어 퀴즈: 날짜별 출제 ===================== */
  let quiz = loadQuiz();
  let quizView = 'today';

  function emptyQuizSlot(setIndex){
    const answers = [];
    for (let i = 0; i < QUIZ_PER_DAY; i++) answers.push(null);
    return { set: setIndex, answers: answers, graded: false, score: 0 };
  }

  function validQuizSlot(slot){
    if (!slot || typeof slot !== 'object') return null;
    const set = Number(slot.set);
    if (!isFinite(set) || set < 0 || set >= QUIZ_DAYS) return null;
    const from = Array.isArray(slot.answers) ? slot.answers : [];
    const answers = [];
    for (let i = 0; i < QUIZ_PER_DAY; i++) {
      const a = from[i];
      const n = Number(a);
      answers.push((a === null || a === undefined || a === '' || isNaN(n) || n < 0 || n > 3) ? null : Math.floor(n));
    }
    const complete = answers.every(function(a){ return a !== null; });
    const graded = !!slot.graded && complete;
    const score = graded ? Math.max(0, Math.min(QUIZ_PER_DAY, Math.round(Number(slot.score) || 0))) : 0;
    return { set: Math.floor(set), answers: answers, graded: graded, score: score };
  }

  function quizDayNumber(d){
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY_MS);
  }

  function todaySetIndex(){
    const n = quizDayNumber(new Date());
    return ((n % QUIZ_DAYS) + QUIZ_DAYS) % QUIZ_DAYS;
  }

  function quizQuestions(setIndex){
    const start = setIndex * QUIZ_PER_DAY;
    return QUIZ_BANK.slice(start, start + QUIZ_PER_DAY);
  }

  function loadQuiz(){
    const base = { v:1, kids:{} };
    KIDS.forEach(function(k){ base.kids[k.id] = null; });
    let saved = null;
    try {
      const raw = localStorage.getItem(QUIZ_KEY);
      if (raw) saved = JSON.parse(raw);
    } catch (e) { return base; }
    if (!saved || typeof saved !== 'object' || !saved.kids || typeof saved.kids !== 'object') return base;
    KIDS.forEach(function(k){
      const one = saved.kids[k.id];
      if (one && typeof one === 'object') base.kids[k.id] = one;
    });
    return base;
  }

  function saveQuiz(){
    try { localStorage.setItem(QUIZ_KEY, JSON.stringify(quiz)); } catch (e) {}
  }

  function resetQuizKid(kidId){
    quiz.kids[kidId] = { date: todayStr(), today: emptyQuizSlot(todaySetIndex()), practice: null };
    return quiz.kids[kidId];
  }

  function ensureQuiz(){
    const t = todayStr();
    if (!quiz || !quiz.kids || typeof quiz.kids !== 'object') quiz = { v:1, kids:{} };
    let changed = false;
    KIDS.forEach(function(k){
      const from = quiz.kids[k.id];
      if (!from || typeof from !== 'object' || from.date !== t) {
        resetQuizKid(k.id);
        changed = true;
        return;
      }
      const fixed = {
        date: t,
        today: validQuizSlot(from.today) || emptyQuizSlot(todaySetIndex()),
        practice: from.practice ? validQuizSlot(from.practice) : null
      };
      if (JSON.stringify(fixed) !== JSON.stringify(from)) { quiz.kids[k.id] = fixed; changed = true; }
    });
    if (changed) saveQuiz();
    return quiz.kids[state.active];
  }

  function quizShowingPractice(){
    const kq = quiz.kids[state.active];
    return quizView === 'practice' && !!(kq && kq.practice);
  }

  function currentQuizSlot(){
    const kq = ensureQuiz();
    if (!kq) return null;
    return quizShowingPractice() ? kq.practice : kq.today;
  }

  function renderQuiz(){
    if (!el.quizCard) return;
    const kq = ensureQuiz();
    const k = curKid();
    if (!kq) { el.quizCard.innerHTML = ''; return; }

    const practice = quizShowingPractice();
    const slot = practice ? kq.practice : kq.today;
    const qs = quizQuestions(slot.set);
    const answered = slot.answers.filter(function(a){ return a !== null; }).length;

    const bookKeys = [];
    qs.forEach(function(q){ if (bookKeys.indexOf(q.book) < 0) bookKeys.push(q.book); });
    const books = bookKeys.map(function(b){
      const meta = QUIZ_BOOKS[b] || { label:b, emoji:'📘' };
      return '<span class="book">' + meta.emoji + ' ' + esc(meta.label) + '</span>';
    }).join('');

    const head = '<div class="card-head"><h2>' + (practice ? '📚 연습 영어 퀴즈' : '📚 오늘의 영어 퀴즈') + '</h2>' +
      '<span class="badge">' + k.emoji + ' ' + esc(k.name) + '</span></div>';

    const meta = '<div class="quiz-meta">' + books +
      '<span class="muted">' + (practice ? '연습 세트' : '오늘의 세트') + ' ' + (slot.set + 1) + ' / ' + QUIZ_DAYS + '</span>' +
      (practice && kq.today.graded ? '<span class="muted">· 오늘 퀴즈 ' + kq.today.score + '/' + QUIZ_PER_DAY + '</span>' : '') +
      '</div>';

    const marks = ['①', '②', '③', '④'];
    const items = qs.map(function(q, qi){
      const picked = slot.answers[qi];
      const opts = q.options.map(function(text, oi){
        let cls = 'q-opt';
        if (!slot.graded) {
          if (picked === oi) cls += ' sel';
        } else if (oi === q.answer) {
          cls += ' ok mark';
        } else if (picked === oi) {
          cls += ' no mark';
        }
        return '<button type="button" class="' + cls + '" data-action="quiz-pick" data-q="' + qi + '" data-o="' + oi + '"' +
          (slot.graded ? ' disabled' : '') + ' aria-pressed="' + (picked === oi) + '">' +
          '<span class="k">' + marks[oi] + '</span><span class="t">' + esc(text) + '</span></button>';
      }).join('');

      let explain = '';
      if (slot.graded) {
        explain = '<div class="q-explain"><b>정답 ' + (q.answer + 1) + '번</b> · ' + esc(q.explain) + '</div>';
      }

      const bm = QUIZ_BOOKS[q.book] || { label:q.book, emoji:'📘' };
      return '<div class="q-item">' +
        '<div class="q-head"><span class="q-no">' + (qi + 1) + '</span>' +
          '<span class="q-chip book">' + bm.emoji + ' ' + esc(bm.label) + '</span>' +
          '<span class="q-chip ' + (q.type === '단어' ? 'word' : 'read') + '">' + esc(q.type) + '</span>' +
        '</div>' +
        '<p class="q-text">' + esc(q.q) + '</p>' + opts + explain +
      '</div>';
    }).join('');

    let scoreHtml = '';
    if (slot.graded) {
      let msg;
      if (slot.score === QUIZ_PER_DAY) msg = '🎉 만점! 오늘 퀴즈를 완벽하게 풀었어요!';
      else if (slot.score === QUIZ_PER_DAY - 1) msg = '💜 아주 잘했어요! 하나만 더 맞히면 만점!';
      else if (slot.score === 3) msg = '👏 좋아요! 해설을 읽고 다시 도전해 봐요.';
      else msg = '💪 괜찮아요! 해설을 읽으면 다음엔 더 잘할 수 있어요.';
      scoreHtml = '<div class="quiz-score"><span class="num"><b>' + slot.score + '</b> / ' + QUIZ_PER_DAY + '점</span>' +
        '<span class="msg">' + msg + '</span></div>';
    }

    let actions;
    if (!slot.graded) {
      actions = '<button class="btn primary" data-action="quiz-grade"' + (answered === QUIZ_PER_DAY ? '' : ' disabled') + '>' +
        '📝 채점하기 (' + answered + '/' + QUIZ_PER_DAY + ')</button>';
    } else {
      actions = '<button class="btn primary" data-action="quiz-retry">🔁 다시 풀기</button>';
    }
    actions += practice
      ? '<button class="btn" data-action="quiz-today">📅 오늘 퀴즈로</button>'
      : '<button class="btn" data-action="quiz-practice">🔄 연습 문제 더 풀기</button>';

    const hint = slot.graded
      ? '점수와 해설은 이 기기에 저장돼요. 날짜가 바뀌면 새 5문제가 나와요.'
      : '5문제를 모두 고르면 채점 버튼이 켜져요.';

    el.quizCard.innerHTML = head + meta + items + scoreHtml +
      '<div class="quiz-actions">' + actions + '</div>' +
      '<p class="quiz-hint">' + hint + '</p>';
  }

  function pickQuizAnswer(qi, oi){
    const slot = currentQuizSlot();
    if (!slot || slot.graded) return;
    if (!(qi >= 0 && qi < QUIZ_PER_DAY) || !(oi >= 0 && oi < 4)) return;
    slot.answers[qi] = oi;
    saveQuiz();
    renderQuiz();
  }

  function gradeQuizNow(){
    const slot = currentQuizSlot();
    if (!slot || slot.graded) return;
    if (slot.answers.some(function(a){ return a === null; })) { toast('5문제를 모두 골라 주세요 🙂'); return; }
    const qs = quizQuestions(slot.set);
    let score = 0;
    for (let i = 0; i < qs.length; i++) { if (slot.answers[i] === qs[i].answer) score++; }
    slot.graded = true;
    slot.score = score;
    saveQuiz();
    renderQuiz();
    if (score === QUIZ_PER_DAY) {
      playChime();
      confetti(document.body);
      buzz([90, 60, 90, 60, 200]);
      toast('🎉 만점! 5 / 5점이에요!');
    } else if (score >= 3) {
      playStamp();
      toast('👏 ' + score + ' / 5점! 해설도 읽어 봐요');
    } else {
      toast('💪 ' + score + ' / 5점! 해설을 보면 다음엔 더 잘할 수 있어요');
    }
  }

  function retryQuiz(){
    const slot = currentQuizSlot();
    if (!slot) return;
    slot.answers = emptyQuizSlot(slot.set).answers;
    slot.graded = false;
    slot.score = 0;
    saveQuiz();
    renderQuiz();
    toast('다시 풀어 볼까요? 화이팅! 💜');
  }

  function startPracticeQuiz(){
    const kq = ensureQuiz();
    if (!kq) return;
    if (kq.practice && !kq.practice.graded) {
      quizView = 'practice';
      renderQuiz();
      return;
    }
    const todaySet = kq.today.set;
    let next = ((kq.practice ? kq.practice.set : todaySet) + 1) % QUIZ_DAYS;
    let guard = 0;
    while (next === todaySet && guard < QUIZ_DAYS) { next = (next + 1) % QUIZ_DAYS; guard++; }
    kq.practice = emptyQuizSlot(next);
    quizView = 'practice';
    saveQuiz();
    renderQuiz();
    toast('🔄 다른 날의 5문제를 준비했어요');
  }

  function backToTodayQuiz(){
    quizView = 'today';
    renderQuiz();
  }

  /* ===================== 렌더: 화면 전환 ===================== */
  let view = 'home';

  function setView(v){
    view = (v === 'quiz') ? 'quiz' : 'home';
    if (view === 'quiz') { try { if (window && window.scrollTo) window.scrollTo(0, 0); } catch (e) {} }
    renderView();
  }

  function renderView(){
    if (el.homeView) el.homeView.hidden = (view !== 'home');
    if (el.quizView) el.quizView.hidden = (view !== 'quiz');
    if (el.vtabHome) {
      el.vtabHome.classList.toggle('active', view === 'home');
      el.vtabHome.setAttribute('aria-pressed', String(view === 'home'));
    }
    if (el.vtabQuiz) {
      el.vtabQuiz.classList.toggle('active', view === 'quiz');
      el.vtabQuiz.setAttribute('aria-pressed', String(view === 'quiz'));
    }
  }

  /* ===================== 타이머 ===================== */
  const RING_C = 2 * Math.PI * 96;

  let timer = loadTimer();
  let timerInterval = null;

  function loadTimer(){
    try {
      const raw = localStorage.getItem(TIMER_KEY);
      if (!raw) return { status:'idle', totalMs:0, endAt:0, remainingMs:0, label:'' };
      const t = JSON.parse(raw);
      if (!t || typeof t !== 'object') throw new Error('bad');
      return {
        status: t.status === 'running' || t.status === 'paused' ? t.status : 'idle',
        totalMs: Number(t.totalMs) || 0,
        endAt: Number(t.endAt) || 0,
        remainingMs: Number(t.remainingMs) || 0,
        label: String(t.label || '')
      };
    } catch (e) {
      return { status:'idle', totalMs:0, endAt:0, remainingMs:0, label:'' };
    }
  }

  function saveTimer(){
    try { localStorage.setItem(TIMER_KEY, JSON.stringify(timer)); } catch (e) {}
  }

  function timerLeft(){
    if (timer.status === 'running') return Math.max(0, timer.endAt - Date.now());
    if (timer.status === 'paused') return Math.max(0, timer.remainingMs);
    return 0;
  }

  function fmtClock(ms){
    const total = Math.ceil(ms / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    return pad2(m) + ':' + pad2(s);
  }

  function renderTimer(){
    const status = timer.status;
    const totalMs = timer.totalMs || 0;
    const left = timerLeft();
    const frac = totalMs > 0 ? Math.max(0, Math.min(1, left / totalMs)) : 0;
    const active = status === 'running' || status === 'paused';

    const presets = PRESETS.map(function(p){
      const on = active && state.preset === p.label;
      return '<button class="preset' + (on ? ' on' : '') + '" data-action="timer-preset" data-min="' + p.min + '" data-label="' + esc(p.label) + '">' +
        '<span>' + p.emoji + '</span>' + p.label + '</button>';
    }).join('');

    const controls = active
      ? '<div class="timer-actions">' +
          '<button class="btn primary" data-action="timer-pause">' + (status === 'paused' ? '▶ 계속하기' : '⏸ 잠깐 멈춤') + '</button>' +
          '<button class="btn" data-action="timer-reset">그만두기</button>' +
        '</div>'
      : '<div class="timer-actions">' +
          '<button class="btn primary" data-action="timer-start-custom">▶ 위 시간으로 시작</button>' +
        '</div>';

    el.timerCard.innerHTML =
      '<div class="card-head"><h2>⏳ 공부 타이머</h2><span class="badge">' + (state.settings.sound ? '🔔 소리 켜짐' : '🔕 무음') + '</span></div>' +
      '<div class="timer-top">' +
        '<svg class="ring" viewBox="0 0 220 220" aria-hidden="true">' +
          '<defs><linearGradient id="timerGrad" x1="0" y1="0" x2="1" y2="1">' +
            '<stop offset="0%" stop-color="#C9B8F8"/><stop offset="100%" stop-color="#8E74DE"/>' +
          '</linearGradient></defs>' +
          '<circle class="ring-bg" cx="110" cy="110" r="96"/>' +
          '<circle class="ring-fg" id="ringFg" cx="110" cy="110" r="96"/>' +
        '</svg>' +
        '<div class="timer-face">' +
          '<div class="timer-time" id="timerTime">' + fmtClock(left) + '</div>' +
          '<div class="timer-label" id="timerLabel">' + esc(timer.label || '타이머를 골라 주세요') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="presets">' + presets + '</div>' +
      '<div class="custom-row">' +
        '<input type="number" id="timerMinutes" min="1" max="180" step="1" inputmode="numeric" value="20" aria-label="직접 입력 분">' +
        '<span class="unit">분</span>' +
        '<button class="btn tiny" data-action="timer-start-custom" style="flex:1">▶ 시작</button>' +
      '</div>' +
      controls +
      '<p class="timer-note">끝나면 알림음과 함께 태블릿 쉬는 시간 알림이 떠요</p>';

    paintTimer();
  }

  function paintTimer(){
    const ring = $('#ringFg');
    const timeEl = $('#timerTime');
    const labelEl = $('#timerLabel');
    if (!ring) return;
    const totalMs = timer.totalMs || 0;
    const left = timerLeft();
    const frac = totalMs > 0 ? Math.max(0, Math.min(1, left / totalMs)) : 1;
    ring.style.strokeDasharray = RING_C;
    ring.style.strokeDashoffset = (RING_C * (1 - frac)).toFixed(1);
    ring.classList.toggle('idle', timer.status === 'idle');
    if (timeEl) timeEl.textContent = fmtClock(left);
    if (labelEl) labelEl.textContent = timer.label || '타이머를 골라 주세요';
  }

  function startTimer(minutes, label){
    const mins = Math.max(1, Math.min(180, Math.round(Number(minutes) || 0)));
    timer = { status:'running', totalMs: mins * 60000, endAt: Date.now() + mins * 60000, remainingMs: 0, label: label };
    state.preset = label;
    saveTimer(); save();
    renderTimer();
    ensureAudio();
    playTick();
    toast('⏳ ' + mins + '분 시작! 끝나면 알려 줄게요');
  }

  function pauseTimer(){
    if (timer.status !== 'running') return;
    timer.remainingMs = timerLeft();
    timer.status = 'paused';
    saveTimer(); renderTimer();
  }

  function resumeTimer(){
    if (timer.status !== 'paused') return;
    timer.endAt = Date.now() + timer.remainingMs;
    timer.status = 'running';
    saveTimer(); renderTimer();
  }

  function resetTimer(silent){
    timer = { status:'idle', totalMs:0, endAt:0, remainingMs:0, label:'' };
    state.preset = null;
    saveTimer(); save();
    renderTimer();
    if (!silent) toast('타이머를 그만뒀어요');
  }

  function finishTimer(){
    const label = timer.label || '공부';
    timer = { status:'idle', totalMs:0, endAt:0, remainingMs:0, label: label };
    state.preset = null;
    saveTimer(); save();
    renderTimer();
    playChime();
    buzz([200, 90, 200, 90, 320]);
    showBreak(label);
  }

  function tick(){
    if (timer.status === 'running') {
      if (timerLeft() <= 0) { finishTimer(); return; }
      paintTimer();
    }
    normalizeDay();
  }

  /* ===================== 알림 팝업 ===================== */
  function confetti(host){
    const chars = ['🎉','✨','🎊','💜','⭐','🌟','💫','🎈'];
    for (let i = 0; i < 16; i++) {
      const s = document.createElement('span');
      s.className = 'confetti';
      s.textContent = chars[i % chars.length];
      s.style.left = (6 + Math.random() * 88) + '%';
      s.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
      s.style.fontSize = (14 + Math.random() * 12).toFixed(0) + 'px';
      host.appendChild(s);
      setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 2600);
    }
  }

  function showHighFive(kidId, streak, rewards){
    const k = KIDS.filter(function(x){ return x.id === kidId; })[0] || curKid();
    const kid = state.kids[kidId];

    let rewardHtml = '';
    if (rewards && rewards.length) {
      rewardHtml = rewards.map(function(r){
        return '<div class="reward">🎁 새 쿠폰! ' + r.emoji + ' ' + r.title + '</div>';
      }).join('');
    }
    if (kid && kid.streak === TREE_TOTAL) {
      rewardHtml += '<div class="reward">🎄 크리스마스 트리 완성! 꼭대기 별이 빛나고 있어요 ⭐</div>';
    }

    el.highfiveContent.innerHTML =
      '<span class="hero">🙌</span>' +
      '<h2>' + k.emoji + ' ' + k.name + ', ' + TASKS.length + '개 다 했어요!</h2>' +
      '<p>🔥 <b>' + streak + '일 연속 성공</b>' + (kid && kid.best >= streak ? ' · 최고 기록이에요!' : '') + '<br>' +
      (rewards && rewards.length ? '쿠폰함에 새 쿠폰이 들어왔어요 💜' : '오늘도 정말 잘했어요!') + '</p>' +
      rewardHtml +
      '<button class="btn primary" data-action="close-highfive">좋아!</button>';

    el.highfive.hidden = false;
    confetti(el.highfiveContent);
    playChime();
    buzz([120, 70, 120, 70, 260]);
  }

  function closeHighFive(){
    el.highfive.hidden = true;
    el.highfiveContent.innerHTML = '';
  }

  function showBreak(label){
    el.breakContent.innerHTML =
      '<span class="hero">⏰</span>' +
      '<h2>시간 끝!</h2>' +
      '<p><b>' + esc(label || '공부') + '</b> 끝났어요.<br>태블릿은 이제 <b>쉬는 시간</b>이에요 🌿<br>눈도 좀 쉬게 해 주세요!</p>' +
      '<button class="btn warm" data-action="close-break">쉬는 시간 시작!</button>' +
      '<button class="btn tiny" data-action="extra-ten" style="width:100%;margin-top:8px">10분 더 하고 싶어요</button>';
    el.breakOverlay.hidden = false;
    try { document.title = '⏰ 시간 끝! · 우리 가족 쿠폰'; } catch (e) {}
  }

  function closeBreak(){
    el.breakOverlay.hidden = true;
    el.breakContent.innerHTML = '';
    try { document.title = '우리 가족 쿠폰 🎟️'; } catch (e) {}
  }

  /* ===================== 렌더: 부모 설정 ===================== */
  let settingsOpen = false;

  function renderSettings(){
    const kidBlocks = KIDS.map(function(k){
      const kid = state.kids[k.id];
      const options = MILESTONES.map(function(m){
        return '<option value="' + m.type + '">' + m.emoji + ' ' + m.title + '</option>';
      }).join('');
      return '<div class="set-group">' +
        '<h3>' + k.emoji + ' ' + k.name + ' 설정</h3>' +
        '<div class="set-line">' +
          '<span class="lab">연속 일수</span>' +
          '<input type="number" id="set-streak-' + k.id + '" min="0" max="999" value="' + kid.streak + '" aria-label="' + k.name + ' 연속 일수">' +
          '<button class="btn tiny" data-action="set-streak" data-kid="' + k.id + '">저장</button>' +
        '</div>' +
        '<div class="set-line">' +
          '<button class="btn tiny" data-action="test-day" data-kid="' + k.id + '">🧪 테스트: 하루 완료 (+1일)</button>' +
          '<button class="btn tiny" data-action="reset-today" data-kid="' + k.id + '">오늘 할 일 초기화</button>' +
        '</div>' +
        '<div class="set-line">' +
          '<span class="lab">쿠폰 지급</span>' +
          '<select id="grant-' + k.id + '" aria-label="' + k.name + ' 쿠폰 종류">' + options + '</select>' +
          '<button class="btn tiny" data-action="grant-coupon" data-kid="' + k.id + '">지급</button>' +
        '</div>' +
        '<p class="set-help">연속 일수를 직접 바꾸면 그 값부터 이어서 계산돼요. (예: 6으로 바꾸고 오늘 할 일을 다 하면 7일째 쿠폰이 나옵니다)</p>' +
      '</div>';
    }).join('');

    const customs = state.missions.filter(function(m){ return m.custom; });
    const customHtml = customs.length
      ? '<div class="custom-mission-list">' + customs.map(function(m){
          return '<span class="chip">' + esc(m.text) +
            '<button data-action="del-mission" data-id="' + m.id + '" aria-label="미션 삭제">×</button></span>';
        }).join('') + '</div>'
      : '<p class="set-help">직접 추가한 미션이 아직 없어요.</p>';

    el.settingsWrap.innerHTML =
      '<details' + (settingsOpen ? ' open' : '') + '>' +
        '<summary>🔧 부모 설정 <span class="muted" style="font-weight:700">(날짜·스트릭 보정, 테스트)</span><span class="arrow">▼</span></summary>' +
        '<div class="set-group">' +
          '<h3>알림음</h3>' +
          '<div class="set-line">' +
            '<button class="btn tiny" data-action="sound">' + (state.settings.sound ? '🔔 켜짐' : '🔕 꺼짐') + '</button>' +
            '<button class="btn tiny" data-action="test-sound">소리 미리 듣기</button>' +
          '</div>' +
          '<p class="set-help">아이 태블릿이 무음 모드면 알림음이 안 들릴 수 있어요.</p>' +
        '</div>' +
        kidBlocks +
        '<div class="set-group">' +
          '<h3>내가 추가한 가족 미션</h3>' + customHtml +
        '</div>' +
        '<div class="set-group">' +
          '<h3>🔗 구글 시트 연결 <span class="muted" style="font-weight:700">(선택)</span></h3>' +
          '<div class="set-line">' +
            '<input type="url" class="sheet-url" id="sheetUrl" inputmode="url" autocomplete="off" spellcheck="false" ' +
              'placeholder="https://script.google.com/macros/s/.../exec" value="' + esc(sheetCfg.url) + '" aria-label="구글 시트 Apps Script URL">' +
          '</div>' +
          '<div class="set-line">' +
            '<button class="btn tiny primary" data-action="sheet-save">저장 & 연결 테스트</button>' +
            '<button class="btn tiny" data-action="sheet-load">시트에서 불러오기</button>' +
            (sheetCfg.url ? '<button class="btn tiny" data-action="sheet-unlink">연결 해제</button>' : '') +
          '</div>' +
          '<p class="sheet-status' + (sheetStatus.kind ? ' ' + sheetStatus.kind : '') + '" id="sheetStatus">' +
            esc(sheetStatus.text || (sheetCfg.url ? '연결된 주소로 시트에 저장돼요.' : '아직 연결하지 않았어요. 비워 두면 이 기기에만 저장돼요.')) + '</p>' +
          '<p class="set-help">주소를 넣으면 영어책·한글책 체크와 흘려듣기 분이 그때마다 시트에 한 줄로 쌓이고, 새로 고칠 때 시트 기록을 다시 불러와 다른 가족 폰과 같은 기록을 봐요. 붙여 넣을 Apps Script 코드는 노션 “🎫 가족 쿠폰 대시보드” 페이지 아래에 있어요.</p>' +
        '</div>' +
        '<div class="set-group">' +
          '<h3>데이터</h3>' +
          '<div class="set-line">' +
            '<button class="btn tiny danger" data-action="reset-all">모든 기록 초기화</button>' +
            '<button class="btn tiny" data-action="reset-timer">타이머 끄기</button>' +
          '</div>' +
          '<p class="set-help">' + (sheetOn()
            ? '이 기기 브라우저에 저장하고, 같은 내용을 구글 시트에도 쌓아요. 다른 기기에서도 불러올 수 있어요.'
            : '기록은 이 기기의 브라우저에만 저장돼요. 다른 기기와 자동으로 맞춰지지 않아요.') + '</p>' +
        '</div>' +
      '</details>';
  }

  /* ===================== 전체 렌더 ===================== */
  function renderAll(){
    el.todayLabel.textContent = koreanDate(new Date());
    el.soundBtn.textContent = state.settings.sound ? '🔔' : '🔕';
    el.soundBtn.classList.toggle('off', !state.settings.sound);
    el.soundBtn.setAttribute('aria-pressed', String(state.settings.sound));
    el.storageNote.textContent = storageOK ? '' : '(이 브라우저는 저장이 제한돼 있어요)';
    if (el.footerNote) {
      el.footerNote.textContent = sheetOn()
        ? '이 파일 하나로 열리고, 기록은 이 기기와 구글 시트에 함께 저장됩니다 ☁️🔒'
        : '외부 연결 없이 이 파일만으로 열려요 · 기록은 이 기기 브라우저에만 저장됩니다 🔒';
    }
    renderTabs();
    renderStreak();
    renderNewYear();
    renderTree();
    renderTasks();
    renderListen();
    renderCoupons();
    renderMission();
    renderTimer();
    renderSettings();
    renderQuiz();
    renderView();
    renderSheetNote();
  }

  /* ===================== 동작 ===================== */
  function toggleTask(taskId){
    const k = curKid();
    const kid = kidState(k.id);
    const was = !!kid.tasks[taskId];

    if (was) delete kid.tasks[taskId];
    else kid.tasks[taskId] = true;

    if (was) {
      justChecked = null;
      saveAndSync(k.id); renderAll();
      return;
    }

    const nowComplete = allDone(kid);
    if (nowComplete && kid.lastDone !== todayStr()) {
      kid.streak += 1;
      kid.lastDone = todayStr();
      kid.totalDone += 1;
      if (kid.streak > kid.best) kid.best = kid.streak;
      const rewards = awardCoupons(kid, kid.streak);
      justChecked = taskId;
      saveAndSync(k.id);
      renderAll();
      playStamp();
      setTimeout(function(){ showHighFive(k.id, kid.streak, rewards); }, 260);
      return;
    }

    justChecked = taskId;
    saveAndSync(k.id); renderAll();
    playTick();
    setTimeout(function(){ justChecked = null; }, 700);
  }

  function useCouponConfirm(id){
    pendingUse = id;
    renderCoupons();
  }

  function confirmUse(id){
    const kid = kidState();
    const c = kid.coupons.filter(function(x){ return x.id === id; })[0];
    if (!c || c.used) { pendingUse = null; renderCoupons(); return; }
    c.used = true;
    c.usedAt = new Date().toISOString();
    pendingUse = null;
    save(); renderAll();
    playChime();
    toast('🎉 ' + c.emoji + ' ' + c.title + ' 사용 완료!');
  }

  function undoUse(id){
    const kid = kidState();
    const c = kid.coupons.filter(function(x){ return x.id === id; })[0];
    if (!c) return;
    c.used = false;
    c.usedAt = null;
    save(); renderAll();
    toast('쿠폰을 다시 쓸 수 있게 되돌렸어요');
  }

  function drawMission(){
    const list = state.missions;
    if (!list.length) { toast('미션이 없어요. 하나 추가해 주세요!'); return; }
    let pick = list[Math.floor(Math.random() * list.length)];
    let guard = 0;
    while (list.length > 1 && pick.text === state.mission.text && guard < 12) {
      pick = list[Math.floor(Math.random() * list.length)];
      guard++;
    }
    state.mission = { date: todayStr(), text: pick.text, done: false };
    save(); renderMission();
    playTick();
  }

  function completeMission(){
    if (!state.mission.text) return;
    state.mission.done = true;
    save(); renderMission();
    confetti(document.body);
    playChime();
    toast('💜 미션 완료! 가족이 더 가까워졌어요');
  }

  function addMission(){
    const input = $('#missionInput');
    if (!input) return;
    const val = input.value.trim();
    if (!val) { toast('미션 내용을 적어 주세요'); return; }
    if (state.missions.some(function(m){ return m.text === val; })) { toast('이미 있는 미션이에요'); return; }
    state.missions.push({ id: uid(), text: val, custom: true });
    input.value = '';
    save(); renderSettings(); renderMission();
    toast('가족 미션을 추가했어요');
  }

  function setStreak(kidId){
    const input = $('#set-streak-' + kidId);
    if (!input) return;
    const v = Math.max(0, Math.min(999, Math.round(Number(input.value) || 0)));
    const kid = state.kids[kidId];
    kid.streak = v;
    if (v > kid.best) kid.best = v;
    if (v === 0) kid.lastDone = null;
    save(); renderAll();
    toast(KIDS.filter(function(k){ return k.id === kidId; })[0].name + ' 연속 성공 ' + v + '일로 맞췄어요');
  }

  function testDay(kidId){
    const kid = state.kids[kidId];
    kid.streak += 1;
    if (kid.streak > kid.best) kid.best = kid.streak;
    kid.totalDone += 1;
    kid.lastDone = yesterdayStr();
    kid.date = todayStr();
    kid.tasks = {};
    const rewards = awardCoupons(kid, kid.streak);
    save(); renderAll();
    const k = KIDS.filter(function(x){ return x.id === kidId; })[0];
    toast('🧪 ' + k.name + ' ' + kid.streak + '일째' + (rewards.length ? ' · 쿠폰 ' + rewards.length + '장 발급!' : ''));
  }

  function resetToday(kidId){
    const kid = state.kids[kidId];
    if (!confirm('오늘 할 일 체크를 모두 지울까요? (연속 일수는 그대로예요)')) return;
    kid.tasks = {};
    kid.lastDone = kid.lastDone === todayStr() ? yesterdayStr() : kid.lastDone;
    save(); renderAll();
    toast('오늘 체크를 초기화했어요');
  }

  function grantCoupon(kidId){
    const sel = $('#grant-' + kidId);
    if (!sel) return;
    const m = MILESTONES.filter(function(x){ return x.type === sel.value; })[0] || MILESTONES[0];
    const kid = state.kids[kidId];
    kid.coupons.unshift({
      id: uid(), key: 'manual-' + uid(), emoji: m.emoji, title: m.title, desc: m.desc, type: m.type,
      issuedAt: new Date().toISOString(), used: false, usedAt: null, streakAt: kid.streak
    });
    save(); renderAll();
    toast(m.emoji + ' ' + m.title + ' 쿠폰을 넣었어요');
  }

  function deleteMission(id){
    state.missions = state.missions.filter(function(m){ return m.id !== id; });
    if (state.mission.text && !state.missions.some(function(m){ return m.text === state.mission.text; })) {
      state.mission = { date:null, text:'', done:false };
    }
    save(); renderAll();
  }

  function resetAll(){
    if (!confirm('모든 기록(체크·흘려듣기·연속 일수·쿠폰·미션)을 지울까요? 되돌릴 수 없어요.')) return;
    if (!confirm('정말 지울까요? 한 번 더 확인해 주세요!')) return;
    state = defaultState();
    save();
    resetTimer(true);
    quiz = { v:1, kids:{} };
    try { localStorage.removeItem(QUIZ_KEY); } catch (e) {}
    ensureQuiz(); quizView = 'today';
    sheetTotals = {};
    renderAll();
    toast('모든 기록을 초기화했어요');
  }

  function toggleSound(){
    state.settings.sound = !state.settings.sound;
    save(); renderAll();
    if (state.settings.sound) { ensureAudio(); playTick(); }
    toast(state.settings.sound ? '🔔 알림음을 켰어요' : '🔕 알림음을 껐어요');
  }

  /* ===================== 이벤트 ===================== */
  document.addEventListener('click', function(e){
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    const kidId = target.dataset.kid;

    switch (action) {
      case 'tab':
        state.active = kidId; pendingUse = null; justChecked = null; quizView = 'today';
        save(); renderAll();
        break;
      case 'view': setView(target.dataset.view); break;
      case 'quiz-pick': pickQuizAnswer(Number(target.dataset.q), Number(target.dataset.o)); break;
      case 'quiz-grade': gradeQuizNow(); break;
      case 'quiz-retry': retryQuiz(); break;
      case 'quiz-practice': startPracticeQuiz(); break;
      case 'quiz-today': backToTodayQuiz(); break;
      case 'listen-add': listenAdd(Number(target.dataset.min) || 0); break;
      case 'listen-set':
        var listenInput = $('#listenMinutes');
        listenSet(listenInput ? listenInput.value : 0);
        break;
      case 'listen-clear': listenClear(); break;
      case 'sheet-save': sheetSaveAndTest(); break;
      case 'sheet-load': sheetLoad(false); break;
      case 'sheet-unlink': sheetUnlink(); break;
      case 'toggle-task': toggleTask(target.dataset.task); break;
      case 'use-coupon': useCouponConfirm(target.dataset.id); break;
      case 'confirm-use': confirmUse(target.dataset.id); break;
      case 'cancel-use': pendingUse = null; renderCoupons(); break;
      case 'undo-coupon': undoUse(target.dataset.id); break;
      case 'draw-mission': drawMission(); break;
      case 'complete-mission': completeMission(); break;
      case 'add-mission': addMission(); break;
      case 'del-mission': deleteMission(target.dataset.id); break;
      case 'timer-preset': startTimer(Number(target.dataset.min), target.dataset.label); break;
      case 'timer-start-custom':
        var minInput = $('#timerMinutes');
        startTimer(minInput ? minInput.value : 20, '내가 정한 ' + (minInput ? Math.round(Number(minInput.value) || 0) : 20) + '분');
        break;
      case 'timer-pause':
        if (timer.status === 'paused') resumeTimer(); else pauseTimer();
        break;
      case 'timer-reset': resetTimer(); break;
      case 'sound': toggleSound(); break;
      case 'set-streak': setStreak(kidId); break;
      case 'test-day': testDay(kidId); break;
      case 'reset-today': resetToday(kidId); break;
      case 'grant-coupon': grantCoupon(kidId); break;
      case 'reset-all': resetAll(); break;
      case 'reset-timer': resetTimer(); break;
      case 'test-sound': ensureAudio(); playChime(); toast('이런 소리가 나요 🔔'); break;
      case 'close-highfive': closeHighFive(); break;
      case 'close-break': closeBreak(); break;
      case 'extra-ten': closeBreak(); startTimer(10, '10분 더'); break;
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' || !e.target) return;
    if (e.target.id === 'missionInput') addMission();
    else if (e.target.id === 'listenMinutes' || e.target.id === 'sheetUrl') {
      if (e.target.id === 'sheetUrl') sheetSaveAndTest();
      else listenSet(e.target.value);
    }
  });

  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) normalizeDay();
  });

  document.addEventListener('toggle', function(e){
    if (e.target && e.target.tagName === 'DETAILS') settingsOpen = e.target.open;
  }, true);

  /* ===================== 시작 ===================== */
  normalizeDay();
  renderAll();

  /* 시트가 연결돼 있으면 새로 열 때마다 시트 기록을 다시 받아 옵니다. */
  if (sheetOn()) sheetLoad(true);

  if (timer.status === 'running' && timerLeft() <= 0) {
    finishTimer();
  } else if (timer.status !== 'idle') {
    paintTimer();
  }

  timerInterval = setInterval(tick, 1000);

  window.addEventListener('beforeunload', function(){ save(); saveTimer(); });
})();
</script>
</body>
</html>

  /* ===================== 렌더: 2단 좌우 균형 =====================
     카드 높이를 실제로 재서, 두 열의 아래 끝이 가장 잘 맞는 나눔을 고릅니다.
     - 폭 820px 미만(휴대폰·작은 세로 화면)은 예전처럼 한 줄로 이어 붙입니다.
     - 820px 이상(아이패드 세로·가로, 데스크톱)은 좌우 2단으로 나뉘어 노출됩니다. */
  const CARD_ORDER = ['streakCard','taskCard','bookCard','couponCard','missionCard'];
  const COL_GAP = 16;              /* .col 의 카드 사이 간격(px) */
  const BALANCE_SLACK = 40;        /* 이 정도 차이면 굳이 카드를 옮기지 않아요 */
  const TWO_COL_MIN = 820;         /* CSS @media (min-width:820px) 와 같은 기준 */

  /* 기본 배치: 연속 성공·오늘의 할 일을 왼쪽, 읽은 책·쿠폰함·가족 미션을 오른쪽 */
  const BASE_SPLIT = {
    left:  ['streakCard','taskCard'],
    right: ['bookCard','couponCard','missionCard']
  };

  function colIds(col){ return Array.prototype.map.call(col.children, function(c){ return c.id; }); }

  function orderColumn(col, list){
    const cur = colIds(col);
    if (cur.length === list.length && cur.every(function(id, i){ return id === list[i]; })) return;
    list.forEach(function(id){
      const card = document.getElementById(id);
      if (card) col.appendChild(card);
    });
  }

  function cardsHeight(list, h){
    let sum = 0;
    list.forEach(function(id){ sum += h[id] || 0; });
    return sum + Math.max(0, list.length - 1) * COL_GAP;
  }

  /* 카드의 '자연 높이'(늘어나기 전 높이)를 잽니다. */
  function naturalHeights(cards){
    const de = document.documentElement;
    de.classList.add('measuring-cards');
    const h = {};
    cards.forEach(function(c){ h[c.id] = Math.ceil(c.getBoundingClientRect().height); });
    de.classList.remove('measuring-cards');
    return h;
  }

  /* 카드를 좌우로 나누는 모든 경우(양쪽 각 2장 이상) 중 높이 차가 가장 작은 나눔을 찾습니다. */
  function bestSplit(h){
    const ids = CARD_ORDER.slice();
    let best = null;
    for (let mask = 1; mask < (1 << ids.length) - 1; mask++) {
      const left = [], right = [];
      ids.forEach(function(id, i){ (mask & (1 << i) ? left : right).push(id); });
      if (left.length < 2 || right.length < 2) continue;
      const diff = Math.abs(cardsHeight(left, h) - cardsHeight(right, h));
      if (!best || diff < best.diff) best = { left: left, right: right, diff: diff };
    }
    return best;
  }

  function layoutCards(){
    if (!el.colA || !el.colB) return;
    /* 퀴즈 화면이 떠 있는 동안엔 홈 카드가 숨어 있어 높이가 0으로 잡힙니다 — 건너뜁니다. */
    if (el.homeView && el.homeView.hidden) return;
    const cards = CARD_ORDER.map(function(id){ return document.getElementById(id); }).filter(Boolean);
    if (!cards.length) return;

    /* 한 줄 화면: 카드 순서 그대로 한 열에 쌓습니다 */
    if (window.innerWidth < TWO_COL_MIN) {
      orderColumn(el.colA, cards.map(function(c){ return c.id; }));
      if (el.colB.firstChild) el.colB.textContent = '';
      return;
    }

    /* 지금 놓인 열 너비 그대로 카드 높이를 재고 → 가장 고른 나눔을 적용
       (2단 화면에서는 마지막 카드가 남는 여백만큼 늘어나 있으므로,
        잴 때만 '늘어나기 전' 자연 높이로 되돌려 정확히 잽니다.) */
    const h = naturalHeights(cards);

    const baseDiff = Math.abs(cardsHeight(BASE_SPLIT.left, h) - cardsHeight(BASE_SPLIT.right, h));
    const best = bestSplit(h);
    const pick = (best && best.diff + BALANCE_SLACK < baseDiff) ? best : BASE_SPLIT;

    orderColumn(el.colA, pick.left);
    orderColumn(el.colB, pick.right);
  }

  /* ===================== 전체 렌더 ===================== */
  function renderAll(){
    el.todayLabel.textContent = '할 일 ' + TASKS.length + '개 중 ' + SUCCESS_NEED + '개 하면 오늘 성공! 🎟️';
    el.soundBtn.textContent = state.settings.sound ? '🔔' : '🔕';
    el.soundBtn.classList.toggle('off', !state.settings.sound);
    el.soundBtn.setAttribute('aria-pressed', String(state.settings.sound));
    el.storageNote.textContent = storageOK ? '' : '(이 브라우저는 저장이 제한돼 있어요)';
    renderTabs();
    renderStreak();
    renderNewYear();
    renderTasks();
    renderBooks();
    renderCoupons();
    renderMission();
    renderSettings();
    renderQuiz();
    renderView();
    layoutCards();
  }

  /* ===================== 동작 ===================== */
  function toggleTask(taskId){
    const k = curKid();
    const kid = kidState(k.id);
    const was = !!kid.tasks[taskId];

    if (was) delete kid.tasks[taskId];
    else kid.tasks[taskId] = true;

    /* 체크를 풀어 기준(SUCCESS_NEED) 아래로 내려가도 오늘 받은 도장·쿠폰은 그대로 둡니다. */
    if (was) {
      justChecked = null;
      save(); renderAll();
      if (stampedToday(kid) && doneCount(kid) < SUCCESS_NEED) {
        toast('오늘 성공 도장은 이미 받았어요! 다시 ' + SUCCESS_NEED + '개를 채우면 그대로 인정 💜');
      }
      return;
    }

    const nowSuccess = isSuccess(kid);
    if (nowSuccess && kid.lastDone !== todayStr()) {
      kid.streak += 1;
      kid.lastDone = todayStr();
      kid.totalDone += 1;
      if (kid.streak > kid.best) kid.best = kid.streak;
      grantDraw(kid);                       /* 도장 받을 때마다 미션 뽑기 1번 */
      const rewards = awardCoupons(kid, kid.streak);
      justChecked = taskId;
      save();
      renderAll();
      playStamp();
      setTimeout(function(){ showHighFive(k.id, kid.streak, rewards, doneCount(kid)); }, 260);
      return;
    }

    justChecked = taskId;
    save(); renderAll();
    playTick();
    setTimeout(function(){ justChecked = null; }, 700);
  }

  function useCouponConfirm(id){
    pendingUse = id;
    renderCoupons();
  }

  function confirmUse(id){
    const kid = kidState();
    const c = kid.coupons.filter(function(x){ return x.id === id; })[0];
    if (!c || c.used) { pendingUse = null; renderCoupons(); return; }
    c.used = true;
    c.usedAt = new Date().toISOString();
    pendingUse = null;
    save(); renderAll();
    playChime();
    toast('🎉 ' + c.emoji + ' ' + c.title + ' 사용 완료!');
  }

  function undoUse(id){
    const kid = kidState();
    const c = kid.coupons.filter(function(x){ return x.id === id; })[0];
    if (!c) return;
    c.used = false;
    c.usedAt = null;
    save(); renderAll();
    toast('쿠폰을 다시 쓸 수 있게 되돌렸어요');
  }

  function drawMission(){
    const k = curKid();
    const kid = kidState(k.id);
    const left = drawsLeft(kid);
    if (left <= 0) {
      toast(stampedToday(kid)
        ? '오늘 뽑기는 다 썼어요. 다음 도장을 받으면 또 뽑을 수 있어요!'
        : '도장을 받으면 미션을 뽑을 수 있어요!');
      renderMission();
      return;
    }
    const list = state.missions;
    if (!list.length) { toast('미션이 없어요. 하나 추가해 주세요!'); return; }
    let pick = list[Math.floor(Math.random() * list.length)];
    let guard = 0;
    while (list.length > 1 && pick.text === state.mission.text && guard < 12) {
      pick = list[Math.floor(Math.random() * list.length)];
      guard++;
    }
    kid.drawsLeft = left - 1;
    state.mission = { date: todayStr(), text: pick.text, done: false, by: k.id };
    save(); renderAll();
    playTick();
    confetti(document.body);
    toast('🎲 가족 미션을 뽑았어요!');
  }

  function completeMission(){
    if (!state.mission.text) return;
    state.mission.done = true;
    save(); renderMission();
    confetti(document.body);
    playChime();
    toast('💜 미션 완료! 가족이 더 가까워졌어요');
  }

  function addMission(){
    const input = $('#missionInput');
    if (!input) return;
    const val = input.value.trim();
    if (!val) { toast('미션 내용을 적어 주세요'); return; }
    if (state.missions.some(function(m){ return m.text === val; })) { toast('이미 있는 미션이에요'); return; }
    state.missions.push({ id: uid(), text: val, custom: true });
    input.value = '';
    save(); renderSettings(); renderMission();
    toast('가족 미션을 추가했어요');
  }

  function setStreak(kidId){
    const input = $('#set-streak-' + kidId);
    if (!input) return;
    const v = Math.max(0, Math.min(999, Math.round(Number(input.value) || 0)));
    const kid = state.kids[kidId];
    kid.streak = v;
    if (v > kid.best) kid.best = v;
    if (v === 0) kid.lastDone = null;
    save(); renderAll();
    toast(KIDS.filter(function(k){ return k.id === kidId; })[0].name + ' 연속 성공 ' + v + '일로 맞췄어요');
  }

  function testDay(kidId){
    const kid = state.kids[kidId];
    kid.streak += 1;
    if (kid.streak > kid.best) kid.best = kid.streak;
    kid.totalDone += 1;
    kid.lastDone = yesterdayStr();
    kid.date = todayStr();
    kid.tasks = {};
    const rewards = awardCoupons(kid, kid.streak);
    save(); renderAll();
    const k = KIDS.filter(function(x){ return x.id === kidId; })[0];
    toast('🧪 ' + k.name + ' ' + kid.streak + '일째' + (rewards.length ? ' · 쿠폰 ' + rewards.length + '장 발급!' : '') + ' (오늘은 아직 도장 전)');
  }

  function resetToday(kidId){
    const kid = state.kids[kidId];
    if (!confirm('오늘 할 일 체크를 모두 지울까요? (연속 일수는 그대로예요)')) return;
    kid.tasks = {};
    kid.lastDone = kid.lastDone === todayStr() ? yesterdayStr() : kid.lastDone;
    save(); renderAll();
    toast('오늘 체크를 초기화했어요');
  }

  function grantCoupon(kidId){
    const sel = $('#grant-' + kidId);
    if (!sel) return;
    const m = MILESTONES.filter(function(x){ return x.type === sel.value; })[0] || MILESTONES[0];
    const kid = state.kids[kidId];
    kid.coupons.unshift({
      id: uid(), key: 'manual-' + uid(), emoji: m.emoji, title: rewardTitle(m.type, m.title), desc: m.desc, type: m.type,
      issuedAt: new Date().toISOString(), used: false, usedAt: null, streakAt: kid.streak
    });
    save(); renderAll();
    toast(m.emoji + ' ' + m.title + ' 쿠폰을 넣었어요');
  }

  /* ===================== 쿠폰 회차 · 보상 문구 · 누적 목표 ===================== */
  function askNewRound(kidId){
    pendingReset = kidId;
    renderStreak();
    renderSettings();
    toast('정말 시작할까요? 아래 버튼으로 확인해 주세요');
  }

  function cancelNewRound(){
    pendingReset = null;
    renderStreak();
    renderSettings();
  }

  /* 새 회차 — 해당 아이의 도장판(streak)만 0일부터. 책·쿠폰·미션·최고 기록은 그대로 둡니다. */
  function startNewRound(kidId){
    const kid = state.kids[kidId];
    const k = KIDS.filter(function(x){ return x.id === kidId; })[0];
    if (!kid || !k) { pendingReset = null; return; }
    kid.round = roundOf(kid) + 1;
    kid.streak = 0;
    pendingReset = null;
    save();
    renderAll();
    playChime();
    toast('🔄 ' + k.emoji + ' ' + k.name + ' 새 회차 시작! 도장은 0일부터, 책·쿠폰은 그대로예요');
  }

  function saveRewards(){
    const next = {};
    MILESTONES.forEach(function(m){
      const input = $('#reward-' + m.type);
      const v = input ? String(input.value || '').trim().slice(0, 24) : '';
      next[m.type] = v || m.title;
    });
    state.settings.rewards = next;
    save();
    renderAll();
    toast('🎟️ 쿠폰 보상 문구를 저장했어요');
  }

  function resetRewards(){
    state.settings.rewards = baseRewards();
    save();
    renderAll();
    toast('쿠폰 보상 문구를 기본값으로 되돌렸어요');
  }

  function goalFromInput(input, fallback){
    if (!input) return fallback;
    const raw = String(input.value == null ? '' : input.value).trim();
    if (!raw) return fallback;
    return safeGoal(raw, fallback);
  }

  function saveGoals(){
    let g1 = goalFromInput($('#goal-1'), bookGoal1());
    let g2 = goalFromInput($('#goal-2'), bookGoal2());
    let fixed = false;
    if (g2 <= g1) {
      fixed = true;
      if (g1 >= 9999) g1 = 9998;
      g2 = Math.min(9999, g1 + 1);
    }
    state.settings.goal1 = g1;
    state.settings.goal2 = g2;
    save();
    renderAll();
    toast(fixed
      ? '📚 2차 목표는 1차보다 커야 해서 ' + fmtNum(g1) + '권 · ' + fmtNum(g2) + '권으로 맞췄어요'
      : '📚 누적 목표를 ' + fmtNum(g1) + '권 · ' + fmtNum(g2) + '권으로 저장했어요');
  }

  function deleteMission(id){
    state.missions = state.missions.filter(function(m){ return m.id !== id; });
    if (state.mission.text && !state.missions.some(function(m){ return m.text === state.mission.text; })) {
      state.mission = { date:null, text:'', done:false };
    }
    save(); renderAll();
  }

  function resetAll(){
    pendingReset = null;
    if (!confirm('모든 기록(할 일 체크·권수·연속 일수·쿠폰·미션 뽑기)을 지울까요? 되돌릴 수 없어요.')) return;
    if (!confirm('정말 지울까요? 한 번 더 확인해 주세요!')) return;
    state = defaultState();
    save();
    quiz = { v:1, kids:{} };
    try { localStorage.removeItem(QUIZ_KEY); } catch (e) {}
    ensureQuiz(); quizView = 'today';
    renderAll();
    toast('모든 기록을 초기화했어요');
  }

  function toggleSound(){
    state.settings.sound = !state.settings.sound;
    save(); renderAll();
    if (state.settings.sound) { ensureAudio(); playTick(); }
    toast(state.settings.sound ? '🔔 알림음을 켰어요' : '🔕 알림음을 껐어요');
  }

  /* ===================== 이벤트 ===================== */
  document.addEventListener('click', function(e){
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    const kidId = target.dataset.kid;

    switch (action) {
      case 'tab':
        state.active = kidId; pendingUse = null; justChecked = null; quizView = 'today';
        save(); renderAll();
        break;
      case 'view': setView(target.dataset.view); break;
      case 'quiz-pick': pickQuizAnswer(Number(target.dataset.q), Number(target.dataset.o)); break;
      case 'quiz-grade': gradeQuizNow(); break;
      case 'quiz-retry': retryQuiz(); break;
      case 'quiz-practice': startPracticeQuiz(); break;
      case 'quiz-today': backToTodayQuiz(); break;
      case 'book-add': bookAdd(target.dataset.item, Number(target.dataset.n) || 0); break;
      case 'book-clear': bookClear(target.dataset.item); break;
      case 'toggle-task': toggleTask(target.dataset.task); break;
      case 'use-coupon': useCouponConfirm(target.dataset.id); break;
      case 'confirm-use': confirmUse(target.dataset.id); break;
      case 'cancel-use': pendingUse = null; renderCoupons(); break;
      case 'undo-coupon': undoUse(target.dataset.id); break;
      case 'draw-mission': drawMission(); break;
      case 'draw-mission-close': closeHighFive(); drawMission(); break;
      case 'complete-mission': completeMission(); break;
      case 'add-mission': addMission(); break;
      case 'del-mission': deleteMission(target.dataset.id); break;
      case 'sound': toggleSound(); break;
      case 'set-streak': setStreak(kidId); break;
      case 'test-day': testDay(kidId); break;
      case 'reset-today': resetToday(kidId); break;
      case 'grant-coupon': grantCoupon(kidId); break;
      case 'ask-new-round': askNewRound(kidId); break;
      case 'confirm-new-round': startNewRound(kidId); break;
      case 'cancel-new-round': cancelNewRound(); break;
      case 'save-rewards': saveRewards(); break;
      case 'reset-rewards': resetRewards(); break;
      case 'save-goals': saveGoals(); break;
      case 'reset-all': resetAll(); break;
      case 'test-sound': ensureAudio(); playChime(); toast('이런 소리가 나요 🔔'); break;
      case 'close-highfive': closeHighFive(); break;
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' || !e.target || !e.target.id) return;
    var id = e.target.id;
    if (id === 'missionInput') addMission();
    else if (id.indexOf('book-') === 0) e.target.blur();
  });

  /* 숫자칸에 입력·수정하는 즉시 저장 (input), 확정되면(input 밖으로 나가면) 값 정리(change) */
  document.addEventListener('input', function(e){
    const t = e.target;
    if (t && t.id && t.id.indexOf('book-') === 0) bookTyped(t.id.slice(5), t);
  });

  document.addEventListener('change', function(e){
    const t = e.target;
    if (t && t.id && t.id.indexOf('book-') === 0) bookCommitted(t.id.slice(5), t);
  });

  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) normalizeDay();
  });

  document.addEventListener('toggle', function(e){
    if (e.target && e.target.tagName === 'DETAILS') settingsOpen = e.target.open;
  }, true);

  /* ===================== 시작 ===================== */
  normalizeDay();
  renderAll();

  /* 자정이 지나면 새 날로 넘기기 (30초에 한 번만 확인) */
  setInterval(normalizeDay, 30000);

  /* 화면 폭이 바뀌면(아이패드 가로↔세로) 좌우 배치를 다시 맞춥니다. */
  let relayoutTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(relayoutTimer);
    relayoutTimer = setTimeout(layoutCards, 120);
  });
  window.addEventListener('orientationchange', function(){ setTimeout(layoutCards, 260); });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function(){ layoutCards(); });
  }

  window.addEventListener('beforeunload', function(){ save(); });
})();
</script>
</body>
</html>
